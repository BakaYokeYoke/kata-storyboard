<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kata Storyboard</title>
<style>
  :root {
    --frame: #1f4fb5;
    --frame-soft: #a3aedb;
    --ink: #111;
    --muted: #6b6f76;
    --line: #111;
    --paper: #fff;
    --bg: #fff;
    --hover: #f2f4fa;
    --accent: #1f4fb5;
    --danger: #b3261e;
    --active-bg: #fff6d6;
    --active-line: #f0cf6b;
    --active-ink: #b07a00;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 14px; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }

  /* ---------- Barre d'outils ---------- */
  .toolbar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 6px 10px; font-size: 12px; color: var(--muted);
  }
  .toolbar .spacer { flex: 1; }
  .toolbar a, .toolbar button {
    color: var(--muted); text-decoration: none; background: none; border: 1px solid transparent;
    border-radius: 4px; padding: 3px 7px;
  }
  .toolbar a:hover, .toolbar button:hover { background: var(--hover); color: var(--ink); }
  .status { min-width: 70px; text-align: right; }

  /* ---------- Storyboard ---------- */
  .frame {
    margin: 0 10px 10px;
    border: 3px solid var(--frame);
    padding: 10px;
    background: var(--frame-soft);
    box-shadow: inset 0 0 0 0 transparent;
  }
  .sheet {
    background: var(--paper);
    border: 3px solid var(--frame);
    padding: 0 14px 14px;
    min-height: calc(100vh - 80px);
    display: flex; flex-direction: column;
  }
  .head {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr);
    border-bottom: 3px solid var(--line);
  }
  .head > div.challenge { position: relative; flex-wrap: wrap; min-width: 0; }
  .sentence { flex: 1; min-width: 0; font-size: 16px; line-height: 1.9; }
  .head .sentence input.blank {
    flex: none; border: none; border-bottom: 1.5px dashed #9aa0a8; padding: 0;
    font-size: 16px; min-width: 3ch; max-width: 100%;
    margin: 0;
  }
  .head textarea.focus-input {
    flex: 1; min-width: 0; border: none; outline: none; resize: none; font-size: 16px;
    line-height: 1.4; padding: 2px 0; background: transparent; overflow: hidden;
  }
  .head .sentence input.blank:focus { border-bottom: 1.5px solid var(--accent); }
  .head .sentence input.blank:not(:placeholder-shown) { border-bottom-color: transparent; }
  .head .sentence input.blank:not(:placeholder-shown):focus { border-bottom-color: var(--accent); }
  .help-btn { font-size: 13px; color: var(--muted); border: 1px solid #c3c7ce; border-radius: 50%; width: 20px; height: 20px; padding: 0; line-height: 18px; background: #fff; align-self: center; }
  .help-btn:hover { color: var(--accent); border-color: var(--accent); }
  .rules {
    position: absolute; right: 8px; top: 100%; z-index: 10; width: min(520px, 90vw);
    background: #fff; border: 1px solid #c3c7ce; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.12);
    padding: 12px 14px; font-size: 13px; line-height: 1.45;
  }
  .rules[hidden] { display: none; }
  .rules table { width: 100%; border-collapse: collapse; margin: 6px 0 8px; }
  .rules th, .rules td { text-align: left; padding: 4px 6px; border-bottom: 1px solid #eceef1; vertical-align: top; }
  .rules th { font-size: 11px; text-transform: uppercase; color: var(--muted); }
  .rules .good { color: #1d7a3a; }
  .rules .bad { color: var(--danger); }
  .rules p { margin: 4px 0; }
  .head > div { padding: 14px 16px 12px; display: flex; gap: 8px; align-items: baseline; }
  .head > div + div { border-left: 3px solid var(--line); margin: 8px 0; padding-top: 6px; padding-bottom: 4px; }
  .head > div:first-child { margin: 8px 0; padding-top: 6px; padding-bottom: 4px; }
  .head label { font-weight: 700; font-size: 19px; white-space: nowrap; }
  .head input { flex: 1; min-width: 0; border: none; outline: none; font-size: 16px; padding: 2px 0; background: transparent; }

  /* Les colonnes Target / Current partagent les mêmes lignes (subgrid) :
     chaque paramètre est aligné face à son homologue. */
  .body {
    flex: 1;
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: auto auto auto 1fr auto;
    margin-top: 14px;
  }
  .col { padding: 6px 16px; display: flex; flex-direction: column; min-width: 0; }
  .col + .col { border-left: 3px solid var(--line); }
  .col.cond { grid-row: 1 / span 5; display: grid; grid-template-rows: subgrid; }
  .col.right { grid-row: 1 / span 5; }
  h2 { font-size: 19px; line-height: 1.2; margin: 4px 0 10px; font-weight: 700; }
  .achieve { display: flex; align-items: center; gap: 6px; font-weight: 700; margin: -4px 0 12px; font-size: 15px; }
  .achieve input { border: none; border-bottom: 2px solid var(--line); outline: none; padding: 2px 2px; font-weight: 400; background: transparent; }

  .metric { display: flex; flex-direction: column; padding: 8px 0; border-top: 1px dashed #d5d8de; min-width: 0; }
  .metric > span { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); margin-bottom: 3px; }
  .metric textarea {
    width: 100%; resize: none; border: none; outline: none; line-height: 1.5;
    background: transparent; padding: 2px 0; min-height: 48px; overflow: hidden;
  }
  .metric.pattern textarea { flex: 1; min-height: 120px; }
  .metric textarea::placeholder, .head input::placeholder, .obs input::placeholder, .exp textarea::placeholder { color: #b4b7bd; }

  .right { padding: 0; }
  .right > section { padding: 6px 16px; }
  .right > section.experiments { flex: 1.3; }
  .right > section.obstacles { flex: 1; border-top: 3px solid var(--line); margin-left: 8px; padding-left: 8px; padding-top: 14px; }

  /* Experimenting record */
  .exp { border: 1px solid #d5d8de; border-radius: 4px; margin-bottom: 8px; background: #fff; }
  .exp-head { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-bottom: 1px solid #e6e8ec; background: #fafbfc; font-size: 12px; }
  .exp-head .num { font-weight: 700; }
  .exp-head input { border: none; outline: none; background: transparent; font-size: 12px; min-width: 0; }
  .exp-head .spacer { flex: 1; }
  .exp-grid { display: grid; grid-template-columns: 1fr; }
  .exp-field { display: grid; grid-template-columns: 70px 1fr; border-top: 1px solid #eef0f3; }
  .exp-field:first-child { border-top: none; }
  .exp-field span { font-size: 11px; color: var(--muted); padding: 5px 6px; text-transform: uppercase; letter-spacing: .02em; }
  .exp textarea { border: none; outline: none; resize: none; padding: 4px 6px; min-height: 26px; line-height: 1.4; background: transparent; width: 100%; }

  .icon { background: none; border: none; color: var(--muted); padding: 2px 5px; border-radius: 3px; line-height: 1; }
  .icon:hover { background: var(--hover); color: var(--ink); }
  .icon.del:hover { color: var(--danger); }
  .add { background: none; border: 1px dashed #c3c7ce; border-radius: 4px; color: var(--muted); padding: 5px 8px; font-size: 12px; width: 100%; text-align: left; }
  .add:hover { border-color: var(--accent); color: var(--accent); }

  /* Block diagrams As Is / To Be */
  .diagram { border-top: 1px dashed #d5d8de; padding: 8px 0 4px; min-width: 0; }
  .diagram-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 8px; min-height: 22px; }
  .diagram-head > span { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
  .diagram-head button { font-size: 11px; padding: 2px 7px; border: 1px solid #c3c7ce; border-radius: 4px; background: #fff; color: var(--muted); }
  .diagram-head button:hover { border-color: var(--accent); color: var(--accent); }
  .blk {
    position: relative; display: flex; align-items: center; gap: 6px;
    border: 2px solid var(--ink); border-radius: 3px; padding: 5px 8px; background: #fff; min-width: 0;
  }
  .blk.obstacle { border-color: var(--danger); background: #fdf3f2; }
  .blk .warn { color: var(--danger); font-size: 13px; }
  .blk input { border: none; outline: none; background: transparent; min-width: 0; padding: 1px 0; }
  .blk .blk-name { flex: 1; font-weight: 700; }
  .blk .blk-val { width: 34%; text-align: right; color: #333; }
  .blk input::placeholder, .conn input::placeholder { color: #b4b7bd; font-weight: 400; }
  .blk-tools {
    position: absolute; right: 4px; top: -13px; display: none; gap: 1px;
    background: #fff; border: 1px solid #c3c7ce; border-radius: 4px; padding: 1px; z-index: 2;
  }
  .blk:hover .blk-tools, .blk:focus-within .blk-tools { display: flex; }
  .blk-tools button { border: none; background: none; font-size: 11px; line-height: 1; padding: 3px 5px; border-radius: 3px; color: var(--muted); }
  .blk-tools button:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
  .blk-tools button:disabled { opacity: .3; cursor: default; }
  .blk-tools button.on { color: var(--danger); }
  .conn { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 26px; }
  .conn .down { font-size: 16px; line-height: 1; color: var(--ink); }
  .conn .side { display: flex; align-items: center; gap: 3px; padding-left: 8px; min-width: 0; font-size: 12px; }
  .conn .tri { color: #d08700; }
  .conn .side input { width: 60px; min-width: 0; border: none; border-bottom: 1px dashed #c3c7ce; outline: none; background: transparent; font-size: 12px; padding: 1px 0; }
  .conn .side button { border: none; background: none; color: var(--muted); font-size: 11px; padding: 2px 4px; border-radius: 3px; }
  .conn .side button:hover { background: var(--hover); color: var(--ink); }
  .conn .add-wait { visibility: hidden; }
  .conn:hover .add-wait, .conn .add-wait:focus { visibility: visible; }
  .diagram .add { margin-top: 8px; }
  .diagram .add:disabled { opacity: .5; cursor: default; }

  /* Obstacle en cours, en tête du Record */
  .rec-obs {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    background: var(--active-bg); border: 1px solid var(--active-line); border-radius: 4px;
    padding: 6px 8px; margin-bottom: 10px; font-size: 13px;
  }
  .rec-obs.none { background: #f6f7f9; border-color: #d5d8de; }
  .rec-obs strong { white-space: nowrap; }
  .rec-obs select { flex: 1; min-width: 120px; font: inherit; padding: 3px 4px; border: 1px solid #c3c7ce; border-radius: 4px; background: #fff; }
  .rec-obs button { font-size: 12px; padding: 3px 8px; border: 1px solid #1d7a3a; color: #1d7a3a; background: #fff; border-radius: 4px; white-space: nowrap; }
  .rec-obs button:hover { background: #1d7a3a; color: #fff; }
  .hint { color: var(--muted); font-size: 12px; font-style: italic; margin: 4px 0 10px; }

  .archive { margin-top: 12px; font-size: 12px; }
  .archive summary { cursor: pointer; color: var(--muted); padding: 3px 0; }
  .archive summary:hover { color: var(--ink); }
  .arch-group { border-left: 3px solid #d5d8de; padding: 4px 0 4px 8px; margin: 8px 0; }
  .arch-group .arch-title { font-weight: 700; }
  .arch-group .badge { font-weight: 400; font-size: 11px; color: var(--muted); border: 1px solid #d5d8de; border-radius: 8px; padding: 0 6px; margin-left: 4px; }
  .arch-group .badge.lifted { color: #1d7a3a; border-color: #9fd0ae; }
  .arch-group ol { margin: 4px 0 0; padding-left: 18px; }
  .arch-group li { margin: 2px 0; }
  .arch-group .learned { color: var(--muted); }

  /* Obstacles */
  .obs { display: flex; align-items: center; gap: 4px; padding: 2px 4px; border-radius: 4px; border: 1px solid transparent; }
  .obs input[type=text] { flex: 1; border: none; outline: none; padding: 3px 2px; background: transparent; min-width: 0; }
  .obs.done input[type=text] { text-decoration: line-through; color: var(--muted); }
  .obs .arrow { color: #c9ccd2; font-size: 15px; }
  .obs .arrow:disabled { visibility: hidden; }
  .obs.focus { background: var(--active-bg); border-color: var(--active-line); }
  .obs.focus .arrow { color: var(--active-ink); }
  .obs.focus input[type=text] { font-weight: 700; }
  .list { margin-bottom: 8px; }

  /* ---------- Kanban ---------- */
  body.kanban-page { background: #f4f5f7; min-height: 100vh; }
  .kb-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 18px 20px 6px; }
  .kb-top h1 { font-size: 22px; margin: 0; }
  .kb-top .sub { color: var(--muted); font-size: 13px; }
  .kb-top .spacer { flex: 1; }
  .btn { padding: 7px 13px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; font-size: 13px; }
  .btn.ghost { background: #fff; color: var(--ink); border-color: #c3c7ce; }
  .btn.danger { background: #fff; color: var(--danger); border-color: #e3b3af; }
  .board-cols {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px;
    padding: 12px 20px 24px; align-items: start;
  }
  .kb-col { background: #ebecf0; border-radius: 8px; padding: 8px; min-height: 160px; display: flex; flex-direction: column; gap: 8px; }
  .kb-col.drop { outline: 2px dashed var(--accent); outline-offset: -2px; background: #e3e8f6; }
  .kb-col-head { display: flex; align-items: center; gap: 6px; padding: 2px 4px 4px; font-weight: 700; font-size: 13px; }
  .kb-col-head .dot { width: 8px; height: 8px; border-radius: 50%; }
  .kb-col-head .count { color: var(--muted); font-weight: 400; }
  .kb-card {
    background: #fff; border-radius: 6px; padding: 10px 11px; cursor: pointer;
    box-shadow: 0 1px 0 rgba(9,30,66,.2); border-left: 4px solid var(--frame); min-width: 0;
  }
  .kb-card:hover { box-shadow: 0 2px 6px rgba(9,30,66,.2); }
  .kb-card.dragging { opacity: .4; }
  .kb-card .t { font-weight: 700; font-size: 14px; margin-bottom: 3px; overflow-wrap: anywhere; }
  .kb-card .fp { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .kb-card .ch { font-size: 12px; line-height: 1.4; color: #333; margin-bottom: 8px;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .kb-card .obs-now { font-size: 12px; background: var(--active-bg); border: 1px solid var(--active-line); border-radius: 4px; padding: 3px 6px; margin-bottom: 8px; overflow-wrap: anywhere; }
  .kb-card .meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--muted); }
  .kb-empty { color: var(--muted); font-size: 12px; text-align: center; padding: 14px 4px; }
  .kb-foot { padding: 0 20px 24px; display: flex; gap: 8px; }
  .kb-foot .btn { font-size: 12px; padding: 4px 9px; }

  /* Tiroir */
  .scrim { position: fixed; inset: 0; background: rgba(9,30,66,.35); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(1180px, 94vw); background: #fff; z-index: 21;
    transform: translateX(100%); transition: transform .25s ease; display: flex; flex-direction: column;
    box-shadow: -8px 0 24px rgba(0,0,0,.15);
  }
  .drawer:not(.open) { box-shadow: none; }
  .drawer.open { transform: none; }
  .drawer-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid #e3e5e8; }
  .drawer-head h2 { margin: 0; font-size: 17px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .drawer-head select { font: inherit; font-size: 13px; padding: 4px 6px; border: 1px solid #c3c7ce; border-radius: 6px; background: #fff; }
  .drawer-head .close { border: none; background: none; font-size: 22px; line-height: 1; color: var(--muted); padding: 2px 6px; border-radius: 4px; }
  .drawer-head .close:hover { background: var(--hover); color: var(--ink); }
  .drawer iframe { flex: 1; border: 0; width: 100%; }

  @media (max-width: 900px) { .board-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 520px) { .board-cols { grid-template-columns: minmax(0, 1fr); } .drawer { width: 100vw; } }

  .toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: #222; color: #fff; padding: 8px 14px; border-radius: 6px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 900px) and (min-width: 521px) {
    .body { grid-template-columns: 1fr 1fr; }
    .col.right { grid-column: 1 / -1; grid-row: auto; border-left: none; border-top: 3px solid var(--line); margin-top: 10px; padding: 14px 0 0; display: grid; grid-template-columns: 1fr 1fr; }
    .right > section.obstacles { border-top: none; border-left: 3px solid var(--line); margin-left: 0; padding: 6px 16px; }
  }
  @media (max-width: 760px) {
    .head { grid-template-columns: minmax(0, 1fr); }
    .head > div + div { border-left: none; border-top: 3px solid var(--line); margin: 0; }
  }
  @media (max-width: 520px) {
    .body { grid-template-columns: 1fr; grid-template-rows: none; }
    .col.cond, .col.right { grid-row: auto; display: flex; flex-direction: column; }
    .col + .col { border-left: none; border-top: 3px solid var(--line); padding-top: 14px; }
    .right > section.obstacles { margin-left: 0; }
    .metric.pattern textarea { min-height: 80px; }
    .frame { margin: 0 4px 4px; padding: 5px; }
    .sheet { padding: 0 6px 10px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Stockage — tout passe par ces 4 fonctions.
   Pour passer à un stockage partagé plus tard, seul ce bloc change.
   ============================================================ */
const PREFIX = 'kata-sb:';
const Store = {
  list() {
    const out = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k.startsWith(PREFIX)) {
        try { out.push(JSON.parse(localStorage.getItem(k))); } catch (e) {}
      }
    }
    return out.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  },
  get(id) {
    try { return JSON.parse(localStorage.getItem(PREFIX + id)); } catch (e) { return null; }
  },
  save(board) {
    board.updatedAt = Date.now();
    localStorage.setItem(PREFIX + board.id, JSON.stringify(board));
  },
  remove(id) { localStorage.removeItem(PREFIX + id); },
};

/* ============================================================
   Utilitaires
   ============================================================ */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 8);
const slug = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
  .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40);
const baseUrl = () => location.href.split('?')[0].split('#')[0];
const boardUrl = id => `${baseUrl()}?board=${encodeURIComponent(id)}`;
const fmtDate = ts => ts ? new Date(ts).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }) : '—';

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 1800);
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast('URL copiée'); }
  catch (e) { prompt('Copiez cette URL :', text); }
}

function newBoard(id, title) {
  return {
    id, title: title || id,
    focusProcess: '', challengeBy: '', challengeResult: '', challengeVision: '',
    targetDate: '',
    target: emptyCondition(), current: emptyCondition(),
    experiments: [], obstacles: [],
    createdAt: Date.now(), updatedAt: Date.now(),
  };
}

// Target et Current ont la même structure : c'est ce qui rend l'écart lisible.
const CONDITION_FIELDS = [
  { key: 'outcome', label: 'Outcome metric',    target: 'Résultat visé, chiffré…',                 current: 'Résultat mesuré aujourd\'hui…' },
  { key: 'process', label: 'Process metric',    target: 'Indicateur de process visé…',            current: 'Indicateur de process aujourd\'hui…' },
  { key: 'pattern', label: 'Operating pattern', target: 'Comment le processus doit fonctionner…', current: 'Comment le processus fonctionne aujourd\'hui…' },
];
function emptyCondition() { return { outcome: '', process: '', pattern: '' }; }

// Remet à niveau un storyboard créé avec une version précédente.
function migrate(b) {
  if (b.challenge && !b.challengeResult) b.challengeResult = b.challenge;
  delete b.challenge;
  for (const side of ['target', 'current']) {
    if (typeof b[side] !== 'object' || !b[side]) b[side] = { ...emptyCondition(), pattern: b[side] || '' };
  }
  b.target.toBe ||= [];
  b.current.asIs ||= [];
  const active = b.obstacles.find(o => o.focus && !o.done);
  b.experiments.forEach(x => {
    if (x.obstacleId === undefined) x.obstacleId = active ? active.id : null;
  });
  return b;
}

const getPath = (obj, path) => path.split('.').reduce((o, k) => o?.[k], obj);
function setPath(obj, path, value) {
  const keys = path.split('.');
  const last = keys.pop();
  keys.reduce((o, k) => o[k], obj)[last] = value;
}

function autoGrow(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }

// Élargit un trou de la phrase Challenge à la taille de son texte (ou du placeholder).
const measureCtx = document.createElement('canvas').getContext('2d');
function fitWidth(el) {
  const cs = getComputedStyle(el);
  measureCtx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  el.style.width = Math.ceil(measureCtx.measureText(el.value || el.placeholder).width) + 1 + 'px';
}

/* ============================================================
   Routage : ?board=<id> → storyboard, sinon → liste
   ============================================================ */
const inDrawer = new URLSearchParams(location.search).has('drawer');

function route() {
  const id = new URLSearchParams(location.search).get('board');
  if (id) renderBoard(id); else renderKanban();
}

/* ============================================================
   Vue Kanban
   ============================================================ */
const STATUSES = [
  { key: 'todo',   label: 'À démarrer', color: '#9aa0a8' },
  { key: 'doing',  label: 'En cours',   color: '#1f4fb5' },
  { key: 'paused', label: 'En pause',   color: '#e0a100' },
  { key: 'done',   label: 'Atteint',    color: '#1d7a3a' },
];
const statusOf = b => STATUSES.some(s => s.key === b.status) ? b.status : 'todo';

function challengeText(b) {
  if (!b.challengeResult) return '';
  return `D'ici ${b.challengeBy || '…'}, ${b.challengeResult}${b.challengeVision ? `, afin de ${b.challengeVision}` : ''}.`;
}

function renderKanban() {
  document.title = 'Kata Storyboards';
  document.body.classList.add('kanban-page');
  if (!Store.list().length) seedDemo();
  const boards = Store.list();

  $('#app').innerHTML = `
    <div class="kb-top">
      <h1>Storyboards</h1>
      <span class="sub">${boards.length} storyboard${boards.length > 1 ? 's' : ''}</span>
      <span class="spacer"></span>
      <button class="btn" id="newBoard">+ Nouveau storyboard</button>
    </div>
    <div class="board-cols">
      ${STATUSES.map(st => {
        const cards = boards.filter(b => statusOf(b) === st.key);
        return `
          <div class="kb-col" data-status="${st.key}">
            <div class="kb-col-head"><span class="dot" style="background:${st.color}"></span>${st.label} <span class="count">${cards.length}</span></div>
            ${cards.map(kanbanCard).join('') || '<div class="kb-empty">Glissez une carte ici</div>'}
          </div>`;
      }).join('')}
    </div>
    <div class="kb-foot">
      <button class="btn ghost" id="resetDemo">Réinitialiser la démo</button>
      <button class="btn ghost" id="export">Exporter (JSON)</button>
    </div>
    <div class="scrim" id="scrim"></div>
    <aside class="drawer" id="drawer" aria-hidden="true">
      <div class="drawer-head">
        <h2 id="drawerTitle"></h2>
        <button class="btn danger" id="drawerDelete">Supprimer</button>
        <button class="close" id="drawerClose" title="Fermer (Échap)">×</button>
      </div>
      <iframe id="drawerFrame" title="Storyboard"></iframe>
    </aside>`;

  // Ouverture au clic + glisser-déposer entre colonnes
  $('#app').querySelectorAll('.kb-card').forEach(card => {
    card.onclick = () => openDrawer(card.dataset.id);
    card.ondragstart = e => { e.dataTransfer.setData('text/plain', card.dataset.id); card.classList.add('dragging'); };
    card.ondragend = () => card.classList.remove('dragging');
  });
  $('#app').querySelectorAll('.kb-col').forEach(col => {
    col.ondragover = e => { e.preventDefault(); col.classList.add('drop'); };
    col.ondragleave = () => col.classList.remove('drop');
    col.ondrop = e => {
      e.preventDefault();
      const b = Store.get(e.dataTransfer.getData('text/plain'));
      if (b && b.status !== col.dataset.status) { b.status = col.dataset.status; Store.save(b); }
      renderKanban();
    };
  });

  $('#newBoard').onclick = () => {
    const name = prompt('Nom du storyboard :');
    if (!name || !name.trim()) return;
    const id = `${slug(name) || 'board'}-${uid()}`;
    Store.save({ ...newBoard(id, name.trim()), status: 'todo' });
    renderKanban();
    openDrawer(id);
  };
  $('#resetDemo').onclick = () => {
    if (!confirm('Remplacer tous les storyboards par les données de démo ?')) return;
    Store.list().forEach(b => Store.remove(b.id));
    seedDemo(); renderKanban();
  };
  $('#export').onclick = () => {
    const blob = new Blob([JSON.stringify(Store.list(), null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `storyboards-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
  };

  $('#scrim').onclick = closeDrawer;
  $('#drawerClose').onclick = closeDrawer;
  document.onkeydown = e => { if (e.key === 'Escape') closeDrawer(); };
}

function kanbanCard(b) {
  const active = (b.obstacles || []).find(o => o.focus && !o.done);
  const nExp = (b.experiments || []).length;
  const nObs = (b.obstacles || []).filter(o => !o.done).length;
  const due = b.targetDate ? new Date(b.targetDate + 'T00:00').toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' }) : '';
  return `
    <div class="kb-card" draggable="true" data-id="${esc(b.id)}">
      <div class="t">${esc(b.title || b.id)}</div>
      ${b.focusProcess ? `<div class="fp">${esc(b.focusProcess)}</div>` : ''}
      ${challengeText(b) ? `<div class="ch">${esc(challengeText(b))}</div>` : ''}
      ${active ? `<div class="obs-now">➜ ${esc(active.text)}</div>` : ''}
      <div class="meta">
        ${due ? `<span title="Target Condition">🎯 ${due}</span>` : ''}
        <span>${nExp} exp.</span>
        <span>${nObs} obstacle${nObs > 1 ? 's' : ''} ouvert${nObs > 1 ? 's' : ''}</span>
      </div>
    </div>`;
}

let drawerId = null;

function openDrawer(id) {
  const b = Store.get(id);
  if (!b) return;
  drawerId = id;
  $('#drawerTitle').textContent = b.title || id;
  $('#drawerFrame').src = boardUrl(id) + '&drawer=1';
  $('#drawerDelete').onclick = () => {
    if (!confirm(`Supprimer « ${b.title || id} » ? Cette action est définitive.`)) return;
    $('#drawerFrame').src = 'about:blank';   // coupe toute sauvegarde en attente dans l'iframe
    Store.remove(id);
    closeDrawer();
  };
  $('#scrim').classList.add('open');
  $('#drawer').classList.add('open');
  $('#drawer').setAttribute('aria-hidden', 'false');
}

function closeDrawer() {
  if (!drawerId) return;
  drawerId = null;
  $('#scrim').classList.remove('open');
  $('#drawer').classList.remove('open');
  $('#drawer').setAttribute('aria-hidden', 'true');
  // Laisse l'iframe terminer sa sauvegarde, puis rafraîchit les cartes.
  setTimeout(() => { $('#drawerFrame').src = 'about:blank'; renderKanban(); }, 350);
}

/* ============================================================
   Block diagrams : To Be (Target) / As Is (Current)
   ============================================================ */
const MAX_BLOCKS = 6;
const DIAGRAMS = {
  target:  { key: 'toBe', title: 'To Be', canFlag: false },
  current: { key: 'asIs', title: 'As Is', canFlag: true },
};
const blocksOf = side => board[side][DIAGRAMS[side].key];

function renderDiagram(side) {
  const { title, canFlag } = DIAGRAMS[side];
  const blocks = blocksOf(side);
  const el = $('#diag-' + side);

  el.innerHTML = `
    <div class="diagram-head">
      <span>${title}</span>
      ${side === 'target' ? `<button data-act="init" title="Rother : la Target Condition se construit en copiant la Current Condition">Initialiser depuis As Is</button>` : ''}
    </div>
    ${blocks.map((b, i) => `
      <div class="blk ${canFlag && b.isObstacle ? 'obstacle' : ''}" data-i="${i}">
        ${canFlag && b.isObstacle ? '<span class="warn" title="Obstacle">⚠</span>' : ''}
        <input class="blk-name" data-k="name" value="${esc(b.name)}" placeholder="Étape">
        <input class="blk-val" data-k="value" value="${esc(b.value)}" placeholder="valeur">
        <div class="blk-tools">
          ${canFlag ? `<button data-act="flag" class="${b.isObstacle ? 'on' : ''}" title="Marquer comme obstacle">⚠</button>` : ''}
          <button data-act="up" title="Monter" ${i === 0 ? 'disabled' : ''}>↑</button>
          <button data-act="down" title="Descendre" ${i === blocks.length - 1 ? 'disabled' : ''}>↓</button>
          <button data-act="del" title="Supprimer">✕</button>
        </div>
      </div>
      ${i < blocks.length - 1 ? `
        <div class="conn" data-i="${i}">
          <span></span>
          <span class="down">↓</span>
          <span class="side">${typeof b.waitAfter === 'string'
            ? `<span class="tri" title="Attente">▲</span><input data-k="waitAfter" value="${esc(b.waitAfter)}" placeholder="durée"><button data-act="nowait" title="Retirer l'attente">✕</button>`
            : `<button class="add-wait" data-act="wait">+ attente</button>`}</span>
        </div>` : ''}`).join('')}
    <button class="add" data-act="add" ${blocks.length >= MAX_BLOCKS ? 'disabled' : ''}>
      ${blocks.length >= MAX_BLOCKS ? `Maximum ${MAX_BLOCKS} blocs` : '+ Bloc'}
    </button>`;

  // Édition inline : on met à jour le modèle sans re-rendre (le focus est conservé).
  el.querySelectorAll('input[data-k]').forEach(input => {
    const i = +input.closest('[data-i]').dataset.i;
    input.oninput = () => { blocks[i][input.dataset.k] = input.value; scheduleSave(); };
  });

  el.querySelectorAll('[data-act]').forEach(btn => btn.onclick = () => {
    const i = +btn.closest('[data-i]')?.dataset.i;
    const act = btn.dataset.act;
    if (act === 'add') blocks.push({ id: uid(), name: '', value: '', isObstacle: false });
    if (act === 'del') blocks.splice(i, 1);
    if (act === 'up' || act === 'down') {
      const j = act === 'up' ? i - 1 : i + 1;
      [blocks[i], blocks[j]] = [blocks[j], blocks[i]];
    }
    if (act === 'flag') blocks[i].isObstacle = !blocks[i].isObstacle;
    if (act === 'wait') blocks[i].waitAfter = '';
    if (act === 'nowait') delete blocks[i].waitAfter;
    if (act === 'init') {
      const src = blocksOf('current');
      if (!src.length) return toast('Le diagramme As Is est vide');
      if (blocks.length && !confirm(`Remplacer les ${blocks.length} bloc(s) du To Be par une copie de l'As Is ?`)) return;
      board.target.toBe = src.map(b => ({ ...b, id: uid(), isObstacle: false }));
    }
    renderDiagram(side); scheduleSave();
    if (act === 'add') el.querySelectorAll('.blk-name')[blocksOf(side).length - 1]?.focus();
    if (act === 'wait') el.querySelector(`.conn[data-i="${i}"] input`)?.focus();
  });
}

const activeObstacle = () => board.obstacles.find(o => o.focus && !o.done);
const obstacleLabel = o => o.text.trim() || 'Obstacle sans titre';
const shortDate = d => d ? new Date(d + 'T00:00').toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' }) : '';

function setActiveObstacle(id) {
  board.obstacles.forEach(o => o.focus = o.id === id);   // un seul obstacle travaillé à la fois
  renderRecord(); renderObstacles(); scheduleSave();
}

/* Experimenting Record : un bloc par obstacle.
   Seul le bloc de l'obstacle en cours est éditable ; les autres sont archivés en dessous. */
function renderRecord() {
  const active = activeObstacle();
  const open = board.obstacles.filter(o => !o.done);
  const current = active ? board.experiments.filter(x => x.obstacleId === active.id) : [];

  const others = board.obstacles
    .filter(o => o !== active)
    .map(o => ({ o, exps: board.experiments.filter(x => x.obstacleId === o.id) }))
    .filter(g => g.exps.length);
  const knownIds = new Set(board.obstacles.map(o => o.id));
  const orphans = board.experiments.filter(x => !x.obstacleId || !knownIds.has(x.obstacleId));
  if (orphans.length) others.push({ o: null, exps: orphans });

  $('#record').innerHTML = `
    <div class="rec-obs ${active ? '' : 'none'}">
      <strong>Obstacle :</strong>
      <select id="obsSelect">
        <option value="">— choisir dans le Parking Lot —</option>
        ${open.map(o => `<option value="${o.id}" ${o === active ? 'selected' : ''}>${esc(obstacleLabel(o).slice(0, 60))}</option>`).join('')}
      </select>
      ${active ? `<button id="liftObs" title="Archive ce record et libère le Record pour l'obstacle suivant">✓ Obstacle levé</button>` : ''}
    </div>
    ${active ? `
      <div id="expList">${current.map((x, i) => experimentCard(x, i)).join('')}</div>
      <button class="add" id="addExp">+ Nouvelle expérience</button>`
    : `<p class="hint">${open.length ? 'Sélectionnez l\'obstacle travaillé pour ouvrir son record.' : 'Ajoutez un obstacle dans le Parking Lot pour commencer.'}</p>`}
    ${others.length ? `
      <details class="archive">
        <summary>Archives · ${others.length} record${others.length > 1 ? 's' : ''}</summary>
        ${others.map(({ o, exps }) => `
          <div class="arch-group">
            <div class="arch-title">${o ? esc(obstacleLabel(o)) : 'Expériences non rattachées'}
              ${o ? `<span class="badge ${o.done ? 'lifted' : ''}">${o.done ? 'levé' : 'en pause'}</span>` : ''}
            </div>
            <ol>${exps.map(x => `
              <li>${esc(shortDate(x.date))} — ${esc(x.step || '(étape non renseignée)')}
                ${x.learned ? `<div class="learned">→ ${esc(x.learned)}</div>` : ''}</li>`).join('')}
            </ol>
          </div>`).join('')}
      </details>` : ''}`;

  $('#obsSelect').onchange = e => setActiveObstacle(e.target.value || null);
  if (!active) return;

  $('#liftObs').onclick = () => {
    active.done = true; active.focus = false;
    renderRecord(); renderObstacles(); scheduleSave();
    toast('Record archivé — choisissez le prochain obstacle');
  };
  $('#addExp').onclick = () => {
    board.experiments.push({ id: uid(), obstacleId: active.id, date: new Date().toISOString().slice(0, 10), step: '', expect: '', happened: '', learned: '' });
    renderRecord(); scheduleSave();
    const steps = $('#expList').querySelectorAll('[data-k=step]');
    steps[steps.length - 1]?.focus();
  };

  $('#expList').querySelectorAll('.exp').forEach(row => {
    const x = board.experiments.find(e => e.id === row.dataset.id);
    row.querySelectorAll('[data-k]').forEach(el => {
      if (el.tagName === 'TEXTAREA') autoGrow(el);
      el.oninput = () => { x[el.dataset.k] = el.value; if (el.tagName === 'TEXTAREA') autoGrow(el); scheduleSave(); };
    });
    row.querySelector('.del').onclick = () => {
      if (!confirm('Supprimer cette expérience ?')) return;
      board.experiments = board.experiments.filter(e => e !== x);
      renderRecord(); scheduleSave();
    };
  });
}

function experimentCard(x, i) {
  return `
    <div class="exp" data-id="${x.id}">
      <div class="exp-head">
        <span class="num">#${i + 1}</span>
        <input type="date" data-k="date" value="${esc(x.date)}">
        <span class="spacer"></span>
        <button class="icon del" title="Supprimer">✕</button>
      </div>
      <div class="exp-grid">
        <label class="exp-field"><span>Step</span><textarea rows="1" data-k="step" placeholder="Étape / ce que je vais tester">${esc(x.step)}</textarea></label>
        <label class="exp-field"><span>Expect</span><textarea rows="1" data-k="expect" placeholder="Qu'est-ce que j'attends ?">${esc(x.expect)}</textarea></label>
        <label class="exp-field"><span>Happened</span><textarea rows="1" data-k="happened" placeholder="Que s'est-il passé ?">${esc(x.happened)}</textarea></label>
        <label class="exp-field"><span>Learned</span><textarea rows="1" data-k="learned" placeholder="Qu'avons-nous appris ?">${esc(x.learned)}</textarea></label>
      </div>
    </div>`;
}

function renderObstacles() {
  const list = $('#obsList');
  list.innerHTML = board.obstacles.map(o => `
    <div class="obs ${o.done ? 'done' : ''} ${o.focus && !o.done ? 'focus' : ''}" data-id="${o.id}">
      <button class="icon arrow" title="Travailler cet obstacle" ${o.done ? 'disabled' : ''}>➜</button>
      <input type="checkbox" ${o.done ? 'checked' : ''} title="Levé">
      <input type="text" value="${esc(o.text)}" placeholder="Obstacle…">
      <button class="icon del" title="Supprimer">✕</button>
    </div>`).join('');

  list.querySelectorAll('.obs').forEach(row => {
    const o = board.obstacles.find(x => x.id === row.dataset.id);
    const text = row.querySelector('input[type=text]');
    text.oninput = () => { o.text = text.value; scheduleSave(); };
    text.onchange = () => renderRecord();   // met à jour le libellé dans le sélecteur
    text.onkeydown = e => { if (e.key === 'Enter') $('#addObs').click(); };
    row.querySelector('input[type=checkbox]').onchange = e => {
      o.done = e.target.checked;
      if (o.done) o.focus = false;
      renderRecord(); renderObstacles(); scheduleSave();
    };
    row.querySelector('.arrow').onclick = () => setActiveObstacle(o.focus ? null : o.id);
    row.querySelector('.del').onclick = () => {
      const n = board.experiments.filter(x => x.obstacleId === o.id).length;
      if (n && !confirm(`Cet obstacle a ${n} expérience(s). Elles passeront en « non rattachées ». Supprimer ?`)) return;
      board.obstacles = board.obstacles.filter(x => x !== o);
      renderRecord(); renderObstacles(); scheduleSave();
    };
  });
}

route();
</script>
</body>
</html>
