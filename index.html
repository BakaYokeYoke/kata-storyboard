<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kata Storyboard</title>
<script>
  // Version de publication : mise à jour automatiquement à chaque commit (.githooks/pre-commit).
  // Sert à contourner le cache de GitHub Pages (10 minutes).
  const APP_VERSION = '20260924-231924';

  // Si le navigateur a servi une copie en cache, on compare avec la version en ligne
  // et on recharge une fois pour récupérer la dernière publication.
  if (window.top === window && location.protocol.startsWith('http')) {
    fetch(`${location.pathname}?check=${Date.now()}`, { cache: 'no-store' })
      .then(r => r.text())
      .then(html => {
        const live = html.match(/APP_VERSION\s*=\s*'([^']+)'/)?.[1];
        const flag = `kata-reloaded-${live}`;
        if (live && live !== APP_VERSION && !sessionStorage.getItem(flag)) {
          sessionStorage.setItem(flag, '1');
          location.reload();
        }
      })
      .catch(() => {});
  }
</script>
<link rel="stylesheet" href="css/app.css?v=20260924-231924">
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

</body>
</html>
