<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kata Storyboard</title>
<style>
  :root {
    --frame: #1f4fb5;
    --frame-soft: #a3aedb;
    --ink: #111;
    --muted: #6b6f76;
    --line: #111;
    --paper: #fff;
    --bg: #fff;
    --hover: #f2f4fa;
    --accent: #1f4fb5;
    --danger: #b3261e;
    --active-bg: #fff6d6;
    --active-line: #f0cf6b;
    --active-ink: #b07a00;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 14px; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }

  /* ---------- Barre d'outils ---------- */
  .toolbar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 6px 10px; font-size: 12px; color: var(--muted);
  }
  .toolbar .spacer { flex: 1; }
  .toolbar a, .toolbar button {
    color: var(--muted); text-decoration: none; background: none; border: 1px solid transparent;
    border-radius: 4px; padding: 3px 7px;
  }
  .toolbar a:hover, .toolbar button:hover { background: var(--hover); color: var(--ink); }
  .status { min-width: 70px; text-align: right; }

  /* ---------- Storyboard ---------- */
  .frame {
    margin: 0 10px 10px;
    border: 3px solid var(--frame);
    padding: 10px;
    background: var(--frame-soft);
    box-shadow: inset 0 0 0 0 transparent;
  }
  .sheet {
    background: var(--paper);
    border: 3px solid var(--frame);
    padding: 0 14px 14px;
    min-height: calc(100vh - 80px);
    display: flex; flex-direction: column;
  }
  .head {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr);
    border-bottom: 3px solid var(--line);
  }
  .head > div.challenge { position: relative; flex-wrap: wrap; min-width: 0; }
  .sentence { flex: 1; min-width: 0; font-size: 16px; line-height: 1.9; }
  .head .sentence input.blank {
    flex: none; border: none; border-bottom: 1.5px dashed #9aa0a8; padding: 0;
    font-size: 16px; min-width: 3ch; max-width: 100%;
    margin: 0;
  }
  .head textarea.focus-input {
    flex: 1; min-width: 0; border: none; outline: none; resize: none; font-size: 16px;
    line-height: 1.4; padding: 2px 0; background: transparent; overflow: hidden;
  }
  .head .sentence input.blank:focus { border-bottom: 1.5px solid var(--accent); }
  .head .sentence input.blank:not(:placeholder-shown) { border-bottom-color: transparent; }
  .head .sentence input.blank:not(:placeholder-shown):focus { border-bottom-color: var(--accent); }
  .help-btn { font-size: 13px; color: var(--muted); border: 1px solid #c3c7ce; border-radius: 50%; width: 20px; height: 20px; padding: 0; line-height: 18px; background: #fff; align-self: center; }
  .help-btn:hover { color: var(--accent); border-color: var(--accent); }
  .rules {
    position: absolute; right: 8px; top: 100%; z-index: 10; width: min(520px, 90vw);
    background: #fff; border: 1px solid #c3c7ce; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.12);
    padding: 12px 14px; font-size: 13px; line-height: 1.45;
  }
  .rules[hidden] { display: none; }
  .rules table { width: 100%; border-collapse: collapse; margin: 6px 0 8px; }
  .rules th, .rules td { text-align: left; padding: 4px 6px; border-bottom: 1px solid #eceef1; vertical-align: top; }
  .rules th { font-size: 11px; text-transform: uppercase; color: var(--muted); }
  .rules .good { color: #1d7a3a; }
  .rules .bad { color: var(--danger); }
  .rules p { margin: 4px 0; }
  .head > div { padding: 14px 16px 12px; display: flex; gap: 8px; align-items: baseline; }
  .head > div + div { border-left: 3px solid var(--line); margin: 8px 0; padding-top: 6px; padding-bottom: 4px; }
  .head > div:first-child { margin: 8px 0; padding-top: 6px; padding-bottom: 4px; }
  .head label { font-weight: 700; font-size: 19px; white-space: nowrap; }
  .head input { flex: 1; min-width: 0; border: none; outline: none; font-size: 16px; padding: 2px 0; background: transparent; }

  /* Les colonnes Target / Current partagent les mêmes lignes (subgrid) :
     chaque paramètre est aligné face à son homologue. */
  .body {
    flex: 1;
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: auto auto auto 1fr auto;
    margin-top: 14px;
  }
  .col { padding: 6px 16px; display: flex; flex-direction: column; min-width: 0; }
  .col + .col { border-left: 3px solid var(--line); }
  .col.cond { grid-row: 1 / span 5; display: grid; grid-template-rows: subgrid; }
  .col.right { grid-row: 1 / span 5; }
  h2 { font-size: 19px; line-height: 1.2; margin: 4px 0 10px; font-weight: 700; }
  .achieve { display: flex; align-items: center; gap: 6px; font-weight: 700; margin: -4px 0 12px; font-size: 15px; }
  .achieve input { border: none; border-bottom: 2px solid var(--line); outline: none; padding: 2px 2px; font-weight: 400; background: transparent; }

  .metric { display: flex; flex-direction: column; padding: 8px 0; border-top: 1px dashed #d5d8de; min-width: 0; }
  .metric > span { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); margin-bottom: 3px; }
  .metric textarea {
    width: 100%; resize: none; border: none; outline: none; line-height: 1.5;
    background: transparent; padding: 2px 0; min-height: 48px; overflow: hidden;
  }
  .metric.pattern textarea { flex: 1; min-height: 120px; }
  .metric textarea::placeholder, .head input::placeholder, .obs input::placeholder, .exp textarea::placeholder { color: #b4b7bd; }

  .right { padding: 0; }
  .right > section { padding: 6px 16px; }
  .right > section.experiments { flex: 1.3; }
  .right > section.obstacles { flex: 1; border-top: 3px solid var(--line); margin-left: 8px; padding-left: 8px; padding-top: 14px; }

  /* Experimenting record */
  .exp { border: 1px solid #d5d8de; border-radius: 4px; margin-bottom: 8px; background: #fff; }
  .exp-head { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-bottom: 1px solid #e6e8ec; background: #fafbfc; font-size: 12px; }
  .exp-head .num { font-weight: 700; }
  .exp-head input { border: none; outline: none; background: transparent; font-size: 12px; min-width: 0; }
  .exp-head .spacer { flex: 1; }
  .exp-grid { display: grid; grid-template-columns: 1fr; }
  .exp-field { display: grid; grid-template-columns: 70px 1fr; border-top: 1px solid #eef0f3; }
  .exp-field:first-child { border-top: none; }
  .exp-field span { font-size: 11px; color: var(--muted); padding: 5px 6px; text-transform: uppercase; letter-spacing: .02em; }
  .exp textarea { border: none; outline: none; resize: none; padding: 4px 6px; min-height: 26px; line-height: 1.4; background: transparent; width: 100%; }

  .icon { background: none; border: none; color: var(--muted); padding: 2px 5px; border-radius: 3px; line-height: 1; }
  .icon:hover { background: var(--hover); color: var(--ink); }
  .icon.del:hover { color: var(--danger); }
  .add { background: none; border: 1px dashed #c3c7ce; border-radius: 4px; color: var(--muted); padding: 5px 8px; font-size: 12px; width: 100%; text-align: left; }
  .add:hover { border-color: var(--accent); color: var(--accent); }

  /* ---------- Time block : Lire → Run → Kata ---------- */
  .tb {
    position: sticky; top: 0; z-index: 15; background: #fff;
    border-bottom: 1px solid #e3e5e8; box-shadow: 0 2px 6px rgba(0,0,0,.04);
    padding: 8px 12px 7px; margin-bottom: 10px;
  }
  .tb-row { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; }
  .stepper { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .stepper .st { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; color: var(--muted); }
  .stepper .st .mark { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; font-size: 11px; border: 1.5px solid #c9ccd2; background: #fff; }
  .stepper .st.done { color: #8a9099; }
  .stepper .st.done .mark { border-color: #1d7a3a; background: #1d7a3a; color: #fff; }
  .stepper .st.active { color: var(--accent); font-weight: 700; }
  .stepper .st.active .mark { border-color: var(--accent); background: var(--accent); color: #fff; }
  .stepper .st.locked { color: #b4b7bd; cursor: not-allowed; }
  .stepper .st.locked .mark { background: #f2f3f5; font-size: 10px; }
  .stepper .link { width: 22px; height: 2px; background: #d5d8de; border-radius: 1px; }
  .stepper .link.done { background: #1d7a3a; }
  .tb-spacer { flex: 1; }
  .timer { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; }
  .timer input { width: 48px; font: inherit; padding: 2px 4px; border: 1px solid #c3c7ce; border-radius: 4px; text-align: right; }
  .timer.running strong { font-size: 15px; }
  .timer.over { color: var(--danger); }
  .tb-actions { display: inline-flex; gap: 6px; flex-wrap: wrap; }
  .tb-btn { font-size: 13px; padding: 6px 12px; border-radius: 6px; border: 1px solid #c3c7ce; background: #fff; color: var(--ink); white-space: nowrap; }
  .tb-btn:hover { border-color: var(--accent); color: var(--accent); }
  .tb-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .tb-btn.primary:hover { background: #173f96; color: #fff; }
  .tb-btn.danger { color: var(--danger); border-color: #e3b3af; }
  .tb-btn:disabled { opacity: .5; cursor: default; }
  .tb-reminder {
    margin-top: 7px; font-size: 13px; line-height: 1.45; background: var(--active-bg); border: 1px solid var(--active-line);
    border-radius: 6px; padding: 5px 9px; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .tb-reminder.empty { background: #f6f7f9; border-color: #d5d8de; color: var(--muted); }
  .tb-reminder .sep { color: #c3a64a; margin: 0 4px; }
  .tb-impossible { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .tb-impossible[hidden] { display: none; }
  .tb-impossible textarea { width: 100%; min-height: 54px; resize: vertical; font: inherit; font-size: 13px; padding: 6px 8px; border: 1px solid #c3c7ce; border-radius: 6px; outline: none; }
  .tb-impossible textarea:focus { border-color: var(--accent); }
  .tb-impossible .row { display: flex; gap: 6px; flex-wrap: wrap; }

  /* Zone de premier plan selon l'étape */
  #stage { margin: 0 10px 10px; }
  .stage-card { border: 2px solid var(--accent); border-radius: 8px; padding: 12px 14px; background: #f7f9ff; margin-bottom: 10px; }
  .stage-card h3 { margin: 0 0 8px; font-size: 15px; }
  .stage-card .muted { color: var(--muted); font-size: 13px; }
  .focus-exp { display: grid; grid-template-columns: 110px 1fr; gap: 4px 10px; font-size: 14px; margin: 6px 0 8px; }
  .focus-exp dt { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .02em; padding-top: 2px; }
  .focus-exp dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
  .stage-card ol { margin: 6px 0 0; padding-left: 20px; font-size: 13px; line-height: 1.6; }

  /* Section Run */
  .run { border: 1px solid #d5d8de; border-radius: 8px; padding: 10px 12px; background: #fff; margin-bottom: 10px; }
  .run-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .run-head h3 { margin: 0; font-size: 15px; }
  .run-head .hint-inline { color: var(--muted); font-size: 12px; flex: 1; min-width: 160px; }
  .seg { display: inline-flex; border: 1px solid #c3c7ce; border-radius: 6px; overflow: hidden; }
  .seg button { border: none; background: #fff; font-size: 12px; padding: 4px 10px; color: var(--muted); }
  .seg button + button { border-left: 1px solid #c3c7ce; }
  .seg button.on { background: var(--accent); color: #fff; }
  .routine { list-style: none; margin: 0 0 8px; padding: 0; }
  .routine li { display: flex; align-items: center; gap: 6px; padding: 3px 0; border-bottom: 1px solid #f0f1f3; }
  .routine li input[type=checkbox] { width: 17px; height: 17px; flex: none; }
  .routine li input.lbl { flex: 1; min-width: 0; border: none; outline: none; font: inherit; padding: 3px 2px; background: transparent; }
  .routine li.done input.lbl { text-decoration: line-through; color: var(--muted); }
  .routine-progress { font-size: 12px; color: var(--muted); }
  .flow { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
  .fcol { background: #f4f5f7; border-radius: 6px; padding: 6px; min-height: 70px; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .fcol.drop { outline: 2px dashed var(--accent); outline-offset: -2px; }
  .fcol.edge { background: #eef1f8; }
  .fcol-h { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; color: var(--muted); display: flex; gap: 4px; overflow: hidden; }
  .fcol-h span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fitem { background: #fff; border: 1px solid #d5d8de; border-radius: 4px; padding: 4px 6px; font-size: 13px; display: flex; gap: 4px; align-items: flex-start; overflow-wrap: anywhere; }
  .fitem[draggable=true] { cursor: grab; }
  .fitem span { flex: 1; min-width: 0; }
  .fcol input.new-item { border: 1px dashed #c3c7ce; border-radius: 4px; padding: 4px 6px; font: inherit; font-size: 12px; background: transparent; outline: none; min-width: 0; width: 100%; }

  /* Storyboard verrouillé hors étape Kata */
  .frame.readonly { position: relative; }
  .frame.readonly::before {
    content: '🔒 Storyboard en lecture seule — éditable à l\2019 étape Kata';
    display: block; font-size: 12px; color: #1f2a5a; margin: -4px 0 6px;
  }
  .frame.readonly .add, .frame.readonly .icon.del, .frame.readonly #liftObs, .frame.readonly .add-wait,
  .frame.readonly [data-act="init"], .frame.readonly .blk-tools, .frame.readonly .conn .side button { display: none !important; }
  .frame.readonly ::placeholder { color: transparent !important; }
  section.experiments.spot { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; scroll-margin-top: 130px; }

  /* Block diagrams As Is / To Be */
  .diagram { border-top: 1px dashed #d5d8de; padding: 8px 0 4px; min-width: 0; }
  .diagram-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 8px; min-height: 22px; }
  .diagram-head > span { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
  .diagram-head button { font-size: 11px; padding: 2px 7px; border: 1px solid #c3c7ce; border-radius: 4px; background: #fff; color: var(--muted); }
  .diagram-head button:hover { border-color: var(--accent); color: var(--accent); }
  .blk {
    position: relative; display: flex; align-items: center; gap: 6px;
    border: 2px solid var(--ink); border-radius: 3px; padding: 5px 8px; background: #fff; min-width: 0;
  }
  .blk.obstacle { border-color: var(--danger); background: #fdf3f2; }
  .blk .warn { color: var(--danger); font-size: 13px; }
  .blk input { border: none; outline: none; background: transparent; min-width: 0; padding: 1px 0; }
  .blk .blk-name { flex: 1; font-weight: 700; }
  .blk .blk-val { width: 34%; text-align: right; color: #333; }
  .blk input::placeholder, .conn input::placeholder { color: #b4b7bd; font-weight: 400; }
  .blk-tools {
    position: absolute; right: 4px; top: -13px; display: none; gap: 1px;
    background: #fff; border: 1px solid #c3c7ce; border-radius: 4px; padding: 1px; z-index: 2;
  }
  .blk:hover .blk-tools, .blk:focus-within .blk-tools { display: flex; }
  .blk-tools button { border: none; background: none; font-size: 11px; line-height: 1; padding: 3px 5px; border-radius: 3px; color: var(--muted); }
  .blk-tools button:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
  .blk-tools button:disabled { opacity: .3; cursor: default; }
  .blk-tools button.on { color: var(--danger); }
  .conn { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 26px; }
  .conn .down { font-size: 16px; line-height: 1; color: var(--ink); }
  .conn .side { display: flex; align-items: center; gap: 3px; padding-left: 8px; min-width: 0; font-size: 12px; }
  .conn .tri { color: #d08700; }
  .conn .side input { width: 60px; min-width: 0; border: none; border-bottom: 1px dashed #c3c7ce; outline: none; background: transparent; font-size: 12px; padding: 1px 0; }
  .conn .side button { border: none; background: none; color: var(--muted); font-size: 11px; padding: 2px 4px; border-radius: 3px; }
  .conn .side button:hover { background: var(--hover); color: var(--ink); }
  .conn .add-wait { visibility: hidden; }
  .conn:hover .add-wait, .conn .add-wait:focus { visibility: visible; }
  .diagram .add { margin-top: 8px; }
  .diagram .add:disabled { opacity: .5; cursor: default; }

  /* Obstacle en cours, en tête du Record */
  .rec-obs {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    background: var(--active-bg); border: 1px solid var(--active-line); border-radius: 4px;
    padding: 6px 8px; margin-bottom: 10px; font-size: 13px;
  }
  .rec-obs.none { background: #f6f7f9; border-color: #d5d8de; }
  .rec-obs strong { white-space: nowrap; }
  .rec-obs select { flex: 1; min-width: 120px; font: inherit; padding: 3px 4px; border: 1px solid #c3c7ce; border-radius: 4px; background: #fff; }
  .rec-obs button { font-size: 12px; padding: 3px 8px; border: 1px solid #1d7a3a; color: #1d7a3a; background: #fff; border-radius: 4px; white-space: nowrap; }
  .rec-obs button:hover { background: #1d7a3a; color: #fff; }
  .hint { color: var(--muted); font-size: 12px; font-style: italic; margin: 4px 0 10px; }

  .archive { margin-top: 12px; font-size: 12px; }
  .archive summary { cursor: pointer; color: var(--muted); padding: 3px 0; }
  .archive summary:hover { color: var(--ink); }
  .arch-group { border-left: 3px solid #d5d8de; padding: 4px 0 4px 8px; margin: 8px 0; }
  .arch-group .arch-title { font-weight: 700; }
  .arch-group .badge { font-weight: 400; font-size: 11px; color: var(--muted); border: 1px solid #d5d8de; border-radius: 8px; padding: 0 6px; margin-left: 4px; }
  .arch-group .badge.lifted { color: #1d7a3a; border-color: #9fd0ae; }
  .arch-group ol { margin: 4px 0 0; padding-left: 18px; }
  .arch-group li { margin: 2px 0; }
  .arch-group .learned { color: var(--muted); }

  /* Obstacles */
  .obs { display: flex; align-items: center; gap: 4px; padding: 2px 4px; border-radius: 4px; border: 1px solid transparent; }
  .obs input[type=text] { flex: 1; border: none; outline: none; padding: 3px 2px; background: transparent; min-width: 0; }
  .obs.done input[type=text] { text-decoration: line-through; color: var(--muted); }
  .obs .arrow { color: #c9ccd2; font-size: 15px; }
  .obs .arrow:disabled { visibility: hidden; }
  .obs.focus { background: var(--active-bg); border-color: var(--active-line); }
  .obs.focus .arrow { color: var(--active-ink); }
  .obs.focus input[type=text] { font-weight: 700; }
  .list { margin-bottom: 8px; }

  /* ---------- Kanban (style Notion) ---------- */
  body.kanban-page {
    --n-ink: rgb(55, 53, 47); --n-muted: rgba(55, 53, 47, .65); --n-faint: rgba(55, 53, 47, .45);
    --n-line: rgba(55, 53, 47, .09); --n-hover: rgba(55, 53, 47, .06); --n-hover2: rgba(55, 53, 47, .12);
    --n-blue: #2383e2;
    --n-shadow-pop: rgba(15,15,15,.05) 0 0 0 1px, rgba(15,15,15,.1) 0 3px 6px, rgba(15,15,15,.2) 0 9px 24px;
    background: #fff; color: var(--n-ink); min-height: 100vh;
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI Variable Display", "Segoe UI", Helvetica, "Apple Color Emoji", Arial, sans-serif;
  }
  svg.i { width: 16px; height: 16px; display: block; flex: none; }
  /* Mise en page Notion : bandeau 45 px, marges latérales 96 px */
  .n-topbar { position: sticky; top: 0; z-index: 12; height: 45px; display: flex; align-items: center; gap: 4px; padding: 0 12px; background: #fff; }
  .n-topbar .spacer { flex: 1; }
  .n-crumb { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; padding: 2px 6px; border-radius: 4px; color: var(--n-ink); max-width: 60vw; white-space: nowrap; }
  .n-crumb span { overflow: hidden; text-overflow: ellipsis; }
  .n-crumb:hover { background: var(--n-hover); }
  .n-page { padding: 0 96px 40px; }
  .n-title { font-size: 32px; font-weight: 700; line-height: 1.2; margin: 0; padding: 38px 0 12px; letter-spacing: -.01em; outline: none; cursor: text; }
  .n-title:empty::before { content: attr(data-placeholder); color: rgba(55,53,47,.2); }
  .n-bar { display: flex; align-items: center; gap: 2px; padding-bottom: 8px; margin-bottom: 10px; }
  .n-tab { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; padding: 5px 10px; border-radius: 16px; background: var(--n-hover); }
  .n-bar .spacer { flex: 1; }
  .n-icon-btn { display: inline-flex; align-items: center; justify-content: center; border: none; background: none; color: var(--n-faint); padding: 5px; border-radius: 6px; line-height: 1; }
  .n-icon-btn:hover { background: var(--n-hover); color: var(--n-ink); }

<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Stockage — tout passe par ces 4 fonctions.
   Pour passer à un stockage partagé plus tard, seul ce bloc change.
   ============================================================ */
function makeStore(prefix) {
  return {
    prefix,
    list() {
      const out = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k.startsWith(prefix)) {
          try { out.push(JSON.parse(localStorage.getItem(k))); } catch (e) {}
        }
      }
      return out.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    },
    get(id) {
      try { return JSON.parse(localStorage.getItem(prefix + id)); } catch (e) { return null; }
    },
    save(doc) {
      doc.updatedAt = Date.now();
      localStorage.setItem(prefix + doc.id, JSON.stringify(doc));
    },
    remove(id) { localStorage.removeItem(prefix + id); },
    // Modifie quelques champs à partir de la version stockée (évite d'écraser le reste).
    patch(id, fields) {
      const doc = this.get(id);
      if (doc) { Object.assign(doc, fields); this.save(doc); }
      return doc;
    },
  };
}
// À incrémenter à chaque publication : force le tiroir à recharger la dernière version
// (GitHub Pages met les pages en cache 10 minutes).
const APP_VERSION = '2026-09-24.3';

const Store = makeStore('kata-sb:');        // Visions (cartes du Kanban)
const Templates = makeStore('kata-tpl:');   // Templates de Vision

/* ============================================================
   Utilitaires
   ============================================================ */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 8);
const slug = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
  .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40);
const baseUrl = () => location.href.split('?')[0].split('#')[0];
const boardUrl = id => `${baseUrl()}?board=${encodeURIComponent(id)}`;
const fmtDate = ts => ts ? new Date(ts).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }) : '—';

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 1800);
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast('URL copiée'); }
  catch (e) { prompt('Copiez cette URL :', text); }
}

function newBoard(id, title) {
  return {
    id, title: title || id,
    focusProcess: '', challengeBy: '', challengeResult: '', challengeVision: '',
    targetDate: '',
    target: emptyCondition(), current: emptyCondition(),
    experiments: [], obstacles: [],
    createdAt: Date.now(), updatedAt: Date.now(),
  };
}

// Target et Current ont la même structure : c'est ce qui rend l'écart lisible.
const CONDITION_FIELDS = [
  { key: 'outcome', label: 'Outcome metric',    target: 'Résultat visé, chiffré…',                 current: 'Résultat mesuré aujourd\'hui…' },
  { key: 'process', label: 'Process metric',    target: 'Indicateur de process visé…',            current: 'Indicateur de process aujourd\'hui…' },
  { key: 'pattern', label: 'Operating pattern', target: 'Comment le processus doit fonctionner…', current: 'Comment le processus fonctionne aujourd\'hui…' },
];
function emptyCondition() { return { outcome: '', process: '', pattern: '' }; }

// Remet à niveau un storyboard créé avec une version précédente.
function migrate(b) {
  if (b.challenge && !b.challengeResult) b.challengeResult = b.challenge;
  delete b.challenge;
  for (const side of ['target', 'current']) {
    if (typeof b[side] !== 'object' || !b[side]) b[side] = { ...emptyCondition(), pattern: b[side] || '' };
  }
  b.target.toBe ||= [];
  b.run ||= { mode: 'routine', routine: [], items: [] };
  b.run.routine ||= []; b.run.items ||= [];
  b.session ||= newSession(b.id);
  b.timeblocks ||= [];
  b.current.asIs ||= [];
  const active = b.obstacles.find(o => o.focus && !o.done);
  b.experiments.forEach(x => {
    if (x.obstacleId === undefined) x.obstacleId = active ? active.id : null;
  });
  return b;
}

const getPath = (obj, path) => path.split('.').reduce((o, k) => o?.[k], obj);
function setPath(obj, path, value) {
  const keys = path.split('.');
  const last = keys.pop();
  keys.reduce((o, k) => o[k], obj)[last] = value;
}

function autoGrow(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }

// Élargit un trou de la phrase Challenge à la taille de son texte (ou du placeholder).
const measureCtx = document.createElement('canvas').getContext('2d');
function fitWidth(el) {
  const cs = getComputedStyle(el);
  measureCtx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  el.style.width = Math.ceil(measureCtx.measureText(el.value || el.placeholder).width) + 1 + 'px';
}

/* ============================================================
   Routage : ?board=<id> → storyboard, sinon → liste
   ============================================================ */
const params = new URLSearchParams(location.search);
const inDrawer = params.has('drawer');
// L'éditeur de storyboard sert aux Visions comme aux templates : seul le stockage change.
let DocStore = Store;

function route() {
  if (params.get('template')) { DocStore = Templates; renderBoard(params.get('template')); }
  else if (params.get('board')) renderBoard(params.get('board'));
  else renderKanban();
}

/* État de la vue (filtre, tri, groupes repliés…) : préférence locale */
const VIEW_KEY = 'kata-view';
function loadView() {
  const base = {
    hidden: [], collapsed: [], sort: 'manual', sortDir: 'asc', groups: [], statuses: [], subgroups: true,
    props: ['challenge', 'obstacle', 'due', 'experiments'],   // propriétés visibles, dans l'ordre
    order: STATUSES.map(st => st.key),                        // ordre des colonnes
    hideEmptyCols: false, colorCols: true, hideEmptySub: false, hiddenSub: [],
  };
  try { return { ...base, ...JSON.parse(localStorage.getItem(VIEW_KEY) || '{}') }; } catch (e) { return base; }
}
function saveView(v) { try { localStorage.setItem(VIEW_KEY, JSON.stringify(v)); } catch (e) {} }

/* Menu contextuel générique (popover Notion) */
function openPop(anchor, items) {
  closePop();
  const pop = document.createElement('div');
  pop.className = 'n-pop';
  pop.id = 'nPop';
  pop.innerHTML = items.map((it, i) => {
    if (it.sep) return '<hr>';
    if (it.header) return `<div class="label">${esc(it.header)}</div>`;
    return `<div class="row ${it.danger ? 'danger' : ''}" data-i="${i}">
      ${it.icon ? `<span class="ic">${icon(it.icon)}</span>` : ''}
      ${it.html || `<span class="name">${esc(it.label)}</span>`}
      ${it.switch !== undefined ? `<span class="n-switch ${it.switch ? 'on' : ''}"></span>` : ''}
      ${it.checked ? `<span class="check">${icon('check')}</span>` : ''}
    </div>`;
  }).join('');
  document.body.appendChild(pop);
  const r = anchor.getBoundingClientRect();
  const w = pop.offsetWidth, h = pop.offsetHeight;
  pop.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + 'px';
  pop.style.top = (r.bottom + 6 + h > innerHeight ? Math.max(8, r.top - h - 6) : r.bottom + 6) + 'px';
  pop.onclick = e => {
    e.stopPropagation();
    const row = e.target.closest('[data-i]');
    if (!row) return;
    const it = items[+row.dataset.i];
    if (!it.keepOpen) closePop();
    it.onClick?.();
  };
}
function closePop() {
  $('#nPop')?.remove();
  document.querySelectorAll('.n-card-tools.open').forEach(t => t.classList.remove('open'));
}

function migrateVisions() {
  Store.list().forEach(b => {
    if (statusOf(b) !== b.status || groupOf(b) !== b.group) Store.patch(b.id, { status: statusOf(b), group: groupOf(b) });
  });
}

function challengeText(b) {
  if (!b.challengeResult) return '';
  return `D'ici ${b.challengeBy || '…'}, ${b.challengeResult}.`;
}

/* Propriétés affichables sur les cartes (Property visibility) */
const PROPS = [
  { key: 'challenge',   label: 'Challenge',           icon: 'text' },
  { key: 'obstacle',    label: 'Obstacle en cours',   icon: 'text' },
  { key: 'due',         label: 'Échéance (Target)',   icon: 'calendar' },
  { key: 'experiments', label: 'Expériences',         icon: 'hash' },
  { key: 'step',        label: 'Étape du time block', icon: 'timer' },
  { key: 'focus',       label: 'Focus Process',       icon: 'text' },
  { key: 'status',      label: 'Statut',              icon: 'status' },
  { key: 'group',       label: 'Pro/Perso',           icon: 'select' },
];
const propDef = k => PROPS.find(p => p.key === k);

function orderedStatuses(view) {
  const known = view.order.map(statusDef).filter(Boolean);
  return [...known, ...STATUSES.filter(st => !view.order.includes(st.key))];
}

function sortedVisions(view) {
  let list = Store.list();
  if (view.groups.length) list = list.filter(b => view.groups.includes(groupOf(b)));
  if (view.statuses.length) list = list.filter(b => view.statuses.includes(statusOf(b)));
  if (view.sort === 'title') list.sort((a, b) => (a.title || '').localeCompare(b.title || '', 'fr'));
  if (view.sort === 'due') list.sort((a, b) => (a.targetDate || '9999').localeCompare(b.targetDate || '9999'));
  if (view.sort !== 'manual' && view.sortDir === 'desc') list.reverse();
  return list;
}

// Nom du Kanban : modifiable, repris dans le fil d'Ariane et l'onglet du navigateur.
const TITLE_KEY = 'kata-board-title';
const boardTitle = () => { try { return localStorage.getItem(TITLE_KEY) || 'Visions'; } catch (e) { return 'Visions'; } };

function renderKanban() {
  document.title = boardTitle();
  document.body.classList.add('kanban-page');
  if (!Store.list().length && !localStorage.getItem('kata-demo-seeded')) seedDemo();
  if (!Templates.list().length) seedTemplates();
  migrateVisions();

  const view = loadView();
  const visions = sortedVisions(view);
  const inCell = (st, g) => visions.filter(b => statusOf(b) === st && (!g || groupOf(b) === g));
  let cols = orderedStatuses(view).filter(s => !view.hidden.includes(s.key));
  if (view.hideEmptyCols) cols = cols.filter(s => inCell(s.key).length);
  const hiddenCols = orderedStatuses(view).filter(s => view.hidden.includes(s.key));
  let rows = view.subgroups ? GROUPS.filter(g => !view.hiddenSub.includes(g.key)) : [null];
  if (view.subgroups && view.hideEmptySub) rows = rows.filter(g => visions.some(b => groupOf(b) === g.key));
  const nCols = Math.max(1, cols.length + (hiddenCols.length ? 1 : 0));

  // Lignes de la grille : en-têtes, puis (titre de sous-groupe + cellules) par groupe.
  // La dernière ligne de cellules prend toute la hauteur restante : colonnes colorées jusqu'en bas.
  const tracks = ['auto'];
  rows.forEach(g => {
    if (g) tracks.push('auto');
    if (!g || !view.collapsed.includes(g.key)) tracks.push('auto');
  });
  const lastCells = rows.length && (!rows.at(-1) || !view.collapsed.includes(rows.at(-1).key));
  if (lastCells) tracks[tracks.length - 1] = 'minmax(80px, 1fr)';

  const cells = g => cols.map(st => `
    <div class="n-cell c-${st.color}" data-status="${st.key}" data-group="${g ? g.key : ''}">
      ${inCell(st.key, g?.key).map(b => visionCard(b, view.props)).join('')}
      <button class="n-add" data-new="${st.key}" data-group="${g ? g.key : 'perso'}">${icon('plus')} New page</button>
    </div>`).join('') + (hiddenCols.length ? '<div class="n-cell empty"></div>' : '');

  const nFilters = view.groups.length + view.statuses.length;
  $('#app').innerHTML = `
    <header class="n-topbar">
      <span class="n-crumb">${icon('doc')}<span id="crumbTitle">${esc(boardTitle() || 'Sans titre')}</span></span>
      <span class="spacer"></span>
      <button class="n-icon-btn" id="pageMore" title="Plus d'actions">${icon('dots')}</button>
    </header>
    <div class="n-page">
      <h1 class="n-title" id="boardTitle" contenteditable="true" spellcheck="false" data-placeholder="Sans titre">${esc(boardTitle())}</h1>
      <div class="n-bar">
        <span class="n-tab">${icon('board')} Board</span>
        <span class="spacer"></span>
        <button class="n-icon-btn ${nFilters ? 'active' : ''}" id="btnFilter" title="Filtrer">${icon('filter')}</button>
        <button class="n-icon-btn ${view.sort !== 'manual' ? 'active' : ''}" id="btnSort" title="Trier">${icon('sort')}</button>
        <span class="n-search" id="search"><button class="n-icon-btn" id="btnSearch" title="Rechercher">${icon('search')}</button><input id="searchInput" placeholder="Rechercher…"></span>
        <button class="n-icon-btn ${panelPage ? 'on' : ''}" id="btnSettings" title="Paramètres de la vue">${icon('sliders')}</button>
        <div class="n-new">
          <button class="main" id="newMain" title="Nouvelle Vision (template par défaut)">New</button>
          <button class="caret" id="newCaret" title="Choisir un template">${icon('chevron')}</button>
          <div class="n-menu" id="tplMenu" hidden></div>
        </div>
      </div>
      <div class="n-board-wrap">
        <div class="n-board ${view.colorCols ? '' : 'nocolor'}" style="grid-template-columns: repeat(${nCols}, 260px); grid-template-rows: ${tracks.join(' ')}">
          ${cols.map(st => `
            <div class="n-head c-${st.color}">
              ${pill(st)}<span class="n-count">${inCell(st.key).length}</span>
              <span class="n-head-tools">
                <button class="n-icon-btn" data-col-more="${st.key}" title="Options du groupe">${icon('dots')}</button>
                <button class="n-icon-btn" data-col-add="${st.key}" title="Nouvelle page">${icon('plus')}</button>
              </span>
            </div>`).join('')}
          ${hiddenCols.length ? `
            <div class="n-head hidden-groups">
              <div class="n-hidden-label">Groupes masqués</div>
              ${hiddenCols.map(st => `<div class="n-hidden-row c-${st.color}" data-unhide="${st.key}" title="Afficher">${pill(st)}<span class="n-count">${inCell(st.key).length}</span></div>`).join('')}
            </div>` : ''}
          ${rows.map(g => {
            if (!g) return cells(null);
            const collapsed = view.collapsed.includes(g.key);
            const n = visions.filter(b => groupOf(b) === g.key).length;
            return `
              <div class="n-group ${collapsed ? 'collapsed' : ''}">
                <button class="toggle" data-toggle="${g.key}" title="${collapsed ? 'Déplier' : 'Replier'}">${icon('tri')}</button>
                <span class="n-pill c-${g.color}">${esc(g.label)}</span><span class="n-count">${n}</span>
              </div>
              ${collapsed ? '' : cells(g)}`;
          }).join('')}
        </div>
      </div>
    </div>
    <div class="scrim" id="scrim"></div>
    <aside class="drawer" id="drawer" aria-hidden="true">
      <div class="peek-top">
        <button class="n-icon-btn" id="drawerClose" title="Fermer (Échap)">${icon('close')}</button>
        <span class="spacer"></span>
        <button class="n-icon-btn" id="peekMore" title="Plus d'actions">${icon('dots')}</button>
      </div>
      <div class="peek-banner" id="peekBanner" hidden>Vous modifiez un template. Les nouvelles Visions créées avec ce template reprendront ce contenu.</div>
      <div class="peek-head">
        <button class="peek-icon" id="peekIcon" title="Changer l'icône"></button>
        <input class="peek-title" id="peekTitle" placeholder="Sans titre" autocomplete="off">
        <div class="peek-props" id="peekProps"></div>
      </div>
      <iframe id="drawerFrame" title="Storyboard"></iframe>
    </aside>
    <div class="emoji-pop" id="emojiPop" hidden>${EMOJIS.map(e => `<button data-emoji="${e}">${e}</button>`).join('')}</div>`;

  const app = $('#app');

  // Colonnes colorées jusqu'au bas de la fenêtre
  const boardEl = $('.n-board');
  boardEl.style.minHeight = Math.max(200, innerHeight - (boardEl.getBoundingClientRect().top + scrollY) - 24) + 'px';

  const titleEl = $('#boardTitle');
  titleEl.oninput = () => {
    const t = titleEl.textContent.trim();
    try { localStorage.setItem(TITLE_KEY, t); } catch (e) {}
    document.title = t || 'Sans titre';
    $('#crumbTitle').textContent = t || 'Sans titre';
  };
  titleEl.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); titleEl.blur(); } };
  titleEl.onblur = () => { if (!titleEl.textContent.trim()) { titleEl.textContent = ''; } };

  // Cartes : ouverture, boutons ✎ / ⋯, glisser-déposer
  app.querySelectorAll('.n-card').forEach(card => {
    const id = card.dataset.id;
    card.onclick = e => { if (!e.target.closest('.n-card-tools, input')) openPeek('vision', id); };
    card.ondragstart = e => { e.dataTransfer.setData('text/plain', id); card.classList.add('dragging'); };
    card.ondragend = () => card.classList.remove('dragging');
    card.querySelector('[data-card="rename"]').onclick = e => { e.stopPropagation(); renameInline(card); };
    card.querySelector('[data-card="more"]').onclick = e => {
      e.stopPropagation();
      const b = Store.get(id);
      openPop(e.currentTarget, [
        { icon: 'peek', label: 'Ouvrir en aperçu', onClick: () => openPeek('vision', id) },
        { icon: 'pencil', label: 'Renommer', onClick: () => renameInline(card) },
        { icon: 'copy', label: 'Dupliquer', onClick: () => { duplicateVision(id); renderKanban(); } },
        { sep: true }, { header: 'Déplacer vers' },
        ...STATUSES.map(st => ({ html: pill(st), checked: statusOf(b) === st.key, onClick: () => { Store.patch(id, { status: st.key }); renderKanban(); } })),
        { sep: true },
        { icon: 'trash', label: 'Supprimer', danger: true, onClick: () => { if (confirm('Supprimer cette Vision ?')) { Store.remove(id); renderKanban(); } } },
      ]);
      card.querySelector('.n-card-tools').classList.add('open');
    };
  });
  app.querySelectorAll('.n-cell[data-status]').forEach(cell => {
    cell.ondragover = e => { e.preventDefault(); cell.classList.add('drop'); };
    cell.ondragleave = () => cell.classList.remove('drop');
    cell.ondrop = e => {
      e.preventDefault();
      const fields = { status: cell.dataset.status };
      if (cell.dataset.group) fields.group = cell.dataset.group;
      Store.patch(e.dataTransfer.getData('text/plain'), fields);
      renderKanban();
    };
  });
  app.querySelectorAll('[data-new]').forEach(btn => btn.onclick = () => createVision(defaultTemplate(), btn.dataset.new, btn.dataset.group));

  // En-têtes de colonne : ⋯ et +
  app.querySelectorAll('[data-col-add]').forEach(btn => btn.onclick = () => createVision(defaultTemplate(), btn.dataset.colAdd, GROUPS[0].key));
  app.querySelectorAll('[data-col-more]').forEach(btn => btn.onclick = e => {
    e.stopPropagation();
    const key = btn.dataset.colMore;
    openPop(btn, [
      { icon: 'hide', label: 'Masquer le groupe', onClick: () => { view.hidden.push(key); saveView(view); renderKanban(); } },
      { icon: 'plus', label: 'Nouvelle page', onClick: () => createVision(defaultTemplate(), key, GROUPS[0].key) },
    ]);
  });
  app.querySelectorAll('[data-unhide]').forEach(row => row.onclick = () => {
    view.hidden = view.hidden.filter(k => k !== row.dataset.unhide); saveView(view); renderKanban();
  });
  app.querySelectorAll('[data-toggle]').forEach(btn => btn.onclick = () => {
    const k = btn.dataset.toggle;
    view.collapsed = view.collapsed.includes(k) ? view.collapsed.filter(x => x !== k) : [...view.collapsed, k];
    saveView(view); renderKanban();
  });

  // Barre d'outils : filtre, tri et réglages ouvrent le panneau « View settings »
  const togglePanel = page => e => { e.stopPropagation(); closePop(); panelPage === page ? closePanel() : openPanel(page); };
  $('#btnFilter').onclick = togglePanel('filter');
  $('#btnSort').onclick = togglePanel('sort');
  $('#btnSettings').onclick = togglePanel('root');
  $('#btnSearch').onclick = e => {
    e.stopPropagation();
    $('#search').classList.add('open');
    $('#searchInput').focus();
  };
  $('#searchInput').oninput = e => {
    const q = e.target.value.trim().toLowerCase();
    app.querySelectorAll('.n-card').forEach(c => c.classList.toggle('hidden-by-search', !!q && !c.innerText.toLowerCase().includes(q)));
  };
  $('#searchInput').onblur = e => { if (!e.target.value) $('#search').classList.remove('open'); };
  $('#pageMore').onclick = e => {
    e.stopPropagation();
    openPop(e.currentTarget, [
      { icon: 'download', label: 'Exporter (JSON)', onClick: exportAll },
      { icon: 'reset', label: 'Réinitialiser la démo', danger: true, onClick: resetDemo },
    ]);
  };

  $('#newMain').onclick = () => createVision(defaultTemplate(), 'incoming', GROUPS[0].key);
  $('#newCaret').onclick = e => { e.stopPropagation(); closePop(); closePanel(); toggleTemplateMenu(); };

  $('#scrim').onclick = closePeek;
  $('#drawerClose').onclick = closePeek;
  $('#emojiPop').onclick = e => e.stopPropagation();
  document.onclick = () => { $('#tplMenu').hidden = true; $('#emojiPop').hidden = true; closePop(); closePanel(); };
  document.onkeydown = e => {
    if (e.key !== 'Escape') return;
    if ($('#nPop') || !$('#tplMenu').hidden || !$('#emojiPop').hidden) { closePop(); $('#tplMenu').hidden = true; $('#emojiPop').hidden = true; return; }
    if (panelPage) return closePanel();
    closePeek();
  };

  if (panelPage) renderPanel();
}

/* ============================================================
   Panneau « View settings » (comme Notion)
   ============================================================ */
let panelPage = null;   // 'root' | 'props' | 'filter' | 'sort' | 'group' | 'subgroup'

function openPanel(page) { panelPage = page; $('#btnSettings')?.classList.add('on'); renderPanel(); }
function closePanel() {
  if (!panelPage) return;
  panelPage = null;
  $('#viewPanel')?.remove();
  $('#btnSettings')?.classList.remove('on');
}

function renderPanel() {
  let el = $('#viewPanel');
  if (!el) {
    el = document.createElement('div');
    el.id = 'viewPanel';
    el.className = 'vp';
    document.body.appendChild(el);
  }
  const bar = $('.n-bar').getBoundingClientRect();
  const newBtn = $('.n-new').getBoundingClientRect();
  el.style.top = Math.max(8, bar.bottom + 2) + 'px';
  el.style.right = Math.max(0, innerWidth - newBtn.right) + 'px';

  const view = loadView();
  const head = (title, back) => `
    <div class="vp-head">
      ${back ? `<button class="vp-back" data-vp-go="root" title="Retour">${icon('back')}</button>` : ''}
      <span class="vp-title ${back ? 'strong' : ''}">${title}</span>
      <button class="vp-x" data-vp-close title="Fermer">${icon('x')}</button>
    </div>`;
  const row = (ic, label, value, go, attrs = '') => `
    <div class="vp-row ${go ? '' : 'static'}" ${go ? `data-vp-go="${go}"` : ''} ${attrs}>
      ${ic ? `<span class="ic">${icon(ic)}</span>` : ''}<span class="lbl">${label}</span>
      <span class="val">${value ?? ''}</span>${go ? `<span class="chev">${icon('chevRight')}</span>` : ''}
    </div>`;
  const toggle = (label, key) => `
    <div class="vp-row" data-switch="${key}"><span class="lbl">${label}</span><span class="n-switch ${view[key] ? 'on' : ''}"></span></div>`;
  const check = on => on ? `<span class="check">${icon('check')}</span>` : '';
  const eyeBtn = (on, attr) => `<button class="eye" ${attr} title="${on ? 'Masquer' : 'Afficher'}">${icon(on ? 'eye' : 'eyeOff')}</button>`;
  const nFilters = view.groups.length + view.statuses.length;

  const pages = {
    root: () => `
      ${head('View settings')}
      ${row('board', 'Layout', 'Board')}
      ${row('eye', 'Property visibility', view.props.length, 'props')}
      ${row('filter', 'Filter', nFilters || '', 'filter')}
      ${row('sort', 'Sort', view.sort !== 'manual' ? 1 : '', 'sort')}
      ${row('board', 'Group', 'Status', 'group')}
      ${row('subgroup', 'Sub-group', view.subgroups ? 'Pro/Perso' : 'None', 'subgroup')}`,

    props: () => {
      const hidden = PROPS.filter(p => !view.props.includes(p.key));
      return `
        ${head('Property visibility', true)}
        <input class="vp-search" id="vpSearch" placeholder="Search for a property…" autocomplete="off">
        <div class="vp-sec"><span>Shown in board</span>${view.props.length ? '<button class="vp-link" data-act="hideAllProps">Hide all</button>' : ''}</div>
        <div class="vp-item fixed" data-label="name"><span class="grip none">${icon('grip')}</span><span class="ic">Aa</span><span class="lbl">Name</span>${eyeBtn(true, 'disabled')}</div>
        ${view.props.map(k => `
          <div class="vp-item" draggable="true" data-key="${k}" data-label="${esc(propDef(k).label.toLowerCase())}">
            <span class="grip">${icon('grip')}</span><span class="ic">${icon(propDef(k).icon)}</span><span class="lbl">${esc(propDef(k).label)}</span>${eyeBtn(true, `data-prop="${k}"`)}
          </div>`).join('')}
        ${hidden.length ? `
          <div class="vp-sec"><span>Hidden in board</span><button class="vp-link" data-act="showAllProps">Show all</button></div>
          ${hidden.map(p => `
            <div class="vp-item off" data-label="${esc(p.label.toLowerCase())}">
              <span class="grip none">${icon('grip')}</span><span class="ic">${icon(p.icon)}</span><span class="lbl">${esc(p.label)}</span>${eyeBtn(false, `data-prop="${p.key}"`)}
            </div>`).join('')}` : ''}`;
    },

    filter: () => `
      ${head('Filter', true)}
      <div class="vp-label">Pro/Perso</div>
      ${GROUPS.map(g => `<div class="vp-row" data-filter-group="${g.key}"><span class="n-pill c-${g.color}" style="border-radius:4px">${g.label}</span>${check(view.groups.includes(g.key))}</div>`).join('')}
      <div class="vp-label">Status</div>
      ${STATUSES.map(st => `<div class="vp-row" data-filter-status="${st.key}">${pill(st)}${check(view.statuses.includes(st.key))}</div>`).join('')}
      ${nFilters ? `<div class="vp-sep"></div><div class="vp-row danger" data-act="clearFilters"><span class="ic">${icon('trash')}</span><span class="lbl">Retirer les filtres</span></div>` : ''}`,

    sort: () => `
      ${head('Sort', true)}
      ${[['manual', 'Manuel'], ['title', 'Name'], ['due', 'Échéance (Target)']].map(([k, l]) => `
        <div class="vp-row" data-sort="${k}"><span class="lbl">${l}</span>${check(view.sort === k)}</div>`).join('')}
      ${view.sort !== 'manual' ? `<div class="vp-sep"></div>${row(null, 'Ordre', view.sortDir === 'asc' ? 'Ascending' : 'Descending', null, 'data-act="sortDir" style="cursor:pointer"')}` : ''}`,

    group: () => {
      const all = orderedStatuses(view);
      return `
        ${head('Group', true)}
        ${row(null, 'Group by', 'Status')}
        ${toggle('Hide empty groups', 'hideEmptyCols')}
        ${toggle('Color columns', 'colorCols')}
        <div class="vp-sep"></div>
        <div class="vp-sec"><span>Groups</span>${view.hidden.length === all.length
          ? '<button class="vp-link" data-act="showAllCols">Show all</button>'
          : '<button class="vp-link" data-act="hideAllCols">Hide all</button>'}</div>
        ${all.map(st => {
          const on = !view.hidden.includes(st.key);
          return `<div class="vp-item ${on ? '' : 'off'}" draggable="true" data-key="${st.key}">
            <span class="grip">${icon('grip')}</span><span class="lbl">${pill(st)}</span>${eyeBtn(on, `data-col="${st.key}"`)}
          </div>`;
        }).join('')}`;
    },

    subgroup: () => `
      ${head('Sub-group', true)}
      ${row(null, 'Sub-group by', view.subgroups ? 'Pro/Perso' : 'None', null, 'data-act="subBy" style="cursor:pointer"')}
      ${view.subgroups ? `
        ${row(null, 'Sort', 'Manual')}
        ${toggle('Hide empty groups', 'hideEmptySub')}
        <div class="vp-sep"></div>
        <div class="vp-sec"><span>Groups</span>${view.hiddenSub.length === GROUPS.length
          ? '<button class="vp-link" data-act="showAllSub">Show all</button>'
          : '<button class="vp-link" data-act="hideAllSub">Hide all</button>'}</div>
        ${GROUPS.map(g => {
          const on = !view.hiddenSub.includes(g.key);
          return `<div class="vp-item ${on ? '' : 'off'}"><span class="grip none">${icon('grip')}</span>
            <span class="lbl"><span class="n-pill c-${g.color}" style="border-radius:4px">${g.label}</span></span>${eyeBtn(on, `data-sub="${g.key}"`)}</div>`;
        }).join('')}
        <div class="vp-sep"></div>
        <div class="vp-row danger" data-act="removeSub"><span class="ic">${icon('trash')}</span><span class="lbl">Remove grouping</span></div>` : ''}`,
  };
  el.innerHTML = pages[panelPage]();

  const commit = () => { saveView(view); renderKanban(); };
  const toggleIn = (arr, k) => arr.includes(k) ? arr.filter(x => x !== k) : [...arr, k];

  el.onclick = e => {
    e.stopPropagation();
    closePop();
    const t = e.target.closest('[data-vp-go],[data-vp-close],[data-act],[data-prop],[data-col],[data-sub],[data-switch],[data-filter-group],[data-filter-status],[data-sort]');
    if (!t || t.disabled) return;
    const d = t.dataset;
    if ('vpClose' in d) return closePanel();
    if (d.vpGo) { panelPage = d.vpGo; return renderPanel(); }
    if (d.prop) view.props = toggleIn(view.props, d.prop);
    if (d.col) view.hidden = toggleIn(view.hidden, d.col);
    if (d.sub) view.hiddenSub = toggleIn(view.hiddenSub, d.sub);
    if (d.switch) view[d.switch] = !view[d.switch];
    if (d.filterGroup) view.groups = toggleIn(view.groups, d.filterGroup);
    if (d.filterStatus) view.statuses = toggleIn(view.statuses, d.filterStatus);
    if (d.sort) view.sort = d.sort;
    if (d.act === 'hideAllProps') view.props = [];
    if (d.act === 'showAllProps') view.props = [...view.props, ...PROPS.map(p => p.key).filter(k => !view.props.includes(k))];
    if (d.act === 'clearFilters') { view.groups = []; view.statuses = []; }
    if (d.act === 'sortDir') view.sortDir = view.sortDir === 'asc' ? 'desc' : 'asc';
    if (d.act === 'hideAllCols') view.hidden = STATUSES.map(st => st.key);
    if (d.act === 'showAllCols') view.hidden = [];
    if (d.act === 'hideAllSub') view.hiddenSub = GROUPS.map(g => g.key);
    if (d.act === 'showAllSub') view.hiddenSub = [];
    if (d.act === 'removeSub') view.subgroups = false;
    if (d.act === 'subBy') {
      return openPop(t, [
        { label: 'None', checked: !view.subgroups, onClick: () => { view.subgroups = false; commit(); } },
        { label: 'Pro/Perso', checked: view.subgroups, onClick: () => { view.subgroups = true; commit(); } },
      ]);
    }
    commit();
  };

  // Recherche de propriété
  const search = $('#vpSearch');
  if (search) search.oninput = () => {
    const q = search.value.trim().toLowerCase();
    el.querySelectorAll('.vp-item[data-label]').forEach(it => it.hidden = !!q && !it.dataset.label.includes(q));
  };

  // Réordonner par glisser-déposer (propriétés visibles, colonnes)
  let dragKey = null;
  el.querySelectorAll('.vp-item[draggable=true]').forEach(it => {
    it.ondragstart = e => { dragKey = it.dataset.key; e.dataTransfer.setData('text/plain', dragKey); };
    it.ondragover = e => { e.preventDefault(); it.classList.add('drop-before'); };
    it.ondragleave = () => it.classList.remove('drop-before');
    it.ondrop = e => {
      e.preventDefault();
      const target = it.dataset.key;
      if (!dragKey || dragKey === target) return renderPanel();
      const key = panelPage === 'props' ? 'props' : 'order';
      const list = key === 'order' ? orderedStatuses(view).map(st => st.key) : [...view.props];
      list.splice(list.indexOf(dragKey), 1);
      list.splice(list.indexOf(target), 0, dragKey);
      view[key] = list;
      commit();
    };
  });
}

/* Carte : titre + propriétés visibles, dans l'ordre choisi */
function visionCard(b, props = []) {
  const active = (b.obstacles || []).find(o => o.focus && !o.done);
  const due = b.targetDate ? new Date(b.targetDate + 'T00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }) : '';
  const nExp = (b.experiments || []).length;
  const stepLabel = { run: '▶ Run en cours', kata: '● Kata' }[b.session?.step];
  const parts = [];
  let chips = [];
  const flush = () => { if (chips.length) { parts.push(`<div class="chips">${chips.join('')}</div>`); chips = []; } };
  props.forEach(k => {
    if (k === 'challenge' && challengeText(b)) { flush(); parts.push(`<div class="prop">${esc(challengeText(b))}</div>`); }
    if (k === 'focus' && b.focusProcess) { flush(); parts.push(`<div class="prop">${esc(b.focusProcess)}</div>`); }
    if (k === 'obstacle' && active) chips.push(`<span class="n-chip obs" title="Obstacle en cours">➜ ${esc(active.text)}</span>`);
    if (k === 'due' && due) chips.push(`<span class="n-chip" title="Target Condition">🎯 ${esc(due)}</span>`);
    if (k === 'experiments' && nExp) chips.push(`<span class="n-chip">${nExp} exp.</span>`);
    if (k === 'step' && stepLabel) chips.push(`<span class="n-chip">${stepLabel}</span>`);
    if (k === 'status') chips.push(pill(statusDef(statusOf(b))).replace('n-pill', 'n-pill small'));
    if (k === 'group') { const g = groupDef(groupOf(b)); chips.push(`<span class="n-pill small c-${g.color}" style="border-radius:4px">${g.label}</span>`); }
  });
  flush();
  return `
    <div class="n-card" draggable="true" data-id="${esc(b.id)}">
      <div class="n-card-tools">
        <button data-card="rename" title="Renommer">${icon('pencil')}</button>
        <button data-card="more" title="Plus d'actions">${icon('dots')}</button>
      </div>
      <div class="t"><span class="ico">${esc(b.icon || '🧭')}</span>${b.title ? `<span class="tt">${esc(b.title)}</span>` : '<span class="tt untitled">Sans titre</span>'}</div>
      ${parts.join('')}
    </div>`;
}

// Renommage directement sur la carte (bouton ✎), comme dans Notion.
function renameInline(card) {
  const id = card.dataset.id;
  const span = card.querySelector('.tt');
  const input = document.createElement('input');
  input.value = Store.get(id).title || '';
  input.placeholder = 'Sans titre';
  span.replaceWith(input);
  card.draggable = false;
  input.focus(); input.select();
  let done = false;
  const commit = save => {
    if (done) return; done = true;
    if (save) Store.patch(id, { title: input.value.trim() });
    renderKanban();
  };
  input.onkeydown = e => { if (e.key === 'Enter') commit(true); if (e.key === 'Escape') { e.stopPropagation(); commit(false); } };
  input.onblur = () => commit(true);
}

function exportAll() {
  const data = { visions: Store.list(), templates: Templates.list() };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
  a.download = `visions-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
}

function resetDemo() {
  if (!confirm('Remplacer toutes les Visions et tous les templates par les données de démo ?')) return;
  Store.list().forEach(b => Store.remove(b.id));
  Templates.list().forEach(t => Templates.remove(t.id));
  seedDemo(); seedTemplates(); renderKanban();
}

/* ---------- Templates ---------- */
const defaultTemplate = () => Templates.list().find(t => t.isDefault) || Templates.list()[0];

function toggleTemplateMenu() {
  const menu = $('#tplMenu');
  if (!menu.hidden) { menu.hidden = true; return; }
  const tpls = Templates.list();
  menu.innerHTML = `
    <div class="label">Templates de Vision</div>
    ${tpls.map(t => `
      <div class="row" data-tpl="${esc(t.id)}">
        <span>${esc(t.icon || '🧭')}</span>
        <span class="name">${esc(t.name || 'Template sans nom')}</span>
        ${t.isDefault ? '<span class="default">Par défaut</span>' : ''}
        <span class="tools">
          ${t.isDefault ? '' : `<button data-act="default" title="Définir par défaut">${icon('star')}</button>`}
          <button data-act="edit" title="Modifier">${icon('pencil')}</button>
          <button data-act="dup" title="Dupliquer">${icon('copy')}</button>
          <button data-act="del" title="Supprimer">${icon('trash')}</button>
        </span>
      </div>`).join('')}
    <hr>
    <div class="row new-tpl" id="tplAdd">${icon('plus')} Nouveau template</div>`;
  menu.hidden = false;
  menu.onclick = e => e.stopPropagation();

  menu.querySelectorAll('[data-tpl]').forEach(row => {
    const id = row.dataset.tpl;
    row.onclick = e => {
      const act = e.target.closest('[data-act]')?.dataset.act;
      menu.hidden = true;
      if (!act) return createVision(Templates.get(id), 'incoming', GROUPS[0].key);
      if (act === 'edit') return openPeek('template', id);
      if (act === 'default') Templates.list().forEach(t => Templates.patch(t.id, { isDefault: t.id === id }));
      if (act === 'dup') {
        const src = Templates.get(id);
        Templates.save({ ...src, id: 'tpl-' + uid() + uid(), name: `${src.name} (copie)`, isDefault: false, createdAt: Date.now() });
      }
      if (act === 'del') {
        if (Templates.list().length === 1) return toast('Il faut garder au moins un template');
        if (!confirm(`Supprimer le template « ${Templates.get(id).name} » ?`)) return;
        const wasDefault = Templates.get(id).isDefault;
        Templates.remove(id);
        if (wasDefault) Templates.patch(Templates.list()[0].id, { isDefault: true });
      }
      toggleTemplateMenu();
    };
  });
  $('#tplAdd').onclick = () => {
    menu.hidden = true;
    const id = 'tpl-' + uid() + uid();
    Templates.save({ ...newBoard(id, ''), name: 'Nouveau template', icon: '🧭', isDefault: false });
    openPeek('template', id);
  };
}

// Copie profonde d'une Vision ou d'un template, avec de nouveaux identifiants.
function cloneDoc(src, fields) {
  const b = JSON.parse(JSON.stringify(src || newBoard('')));
  const idMap = {};
  delete b.name; delete b.isDefault;
  Object.assign(b, { id: 'v-' + uid() + uid(), createdAt: Date.now() }, fields);
  b.obstacles = (b.obstacles || []).map(o => { const id = uid(); idMap[o.id] = id; return { ...o, id }; });
  b.experiments = (b.experiments || []).map(x => ({ ...x, id: uid(), obstacleId: idMap[x.obstacleId] ?? null }));
  // Nouvelle carte = nouveau cycle : pas de session en cours, checklist décochée.
  delete b.session; b.timeblocks = [];
  if (b.run) b.run = { ...b.run, items: [], routine: (b.run.routine || []).map(r => ({ ...r, id: uid(), done: false })) };
  ['target', 'current'].forEach(side => {
    const key = side === 'target' ? 'toBe' : 'asIs';
    if (b[side]?.[key]) b[side][key] = b[side][key].map(k => ({ ...k, id: uid() }));
  });
  Store.save(b);
  return b;
}

function duplicateVision(id) {
  const src = Store.get(id);
  return cloneDoc(src, { title: src.title ? `${src.title} (copie)` : '' });
}

// Crée une Vision à partir d'un template dans la colonne / le groupe donnés, puis l'ouvre.
function createVision(tpl, status, group = 'perso') {
  const b = cloneDoc(tpl, { status, group, title: '' });
  renderKanban();
  openPeek('vision', b.id, { isNew: true });
  setTimeout(() => $('#peekTitle').focus(), 280);
}

/* ---------- Tiroir (side peek) ---------- */
let peek = null;   // { kind: 'vision' | 'template', id }

function openPeek(kind, id, { isNew = false } = {}) {
  const S = kind === 'template' ? Templates : Store;
  const doc = S.get(id);
  if (!doc) return;
  peek = { kind, id, isNew };   // isNew : carte tout juste créée, abandonnée si le titre reste vide
  const isTpl = kind === 'template';

  $('#peekBanner').hidden = !isTpl;
  $('#peekIcon').textContent = doc.icon || '🧭';
  const titleKey = isTpl ? 'name' : 'title';
  $('#peekTitle').value = doc[titleKey] || '';
  $('#peekTitle').placeholder = isTpl ? 'Nom du template' : 'Sans titre';
  $('#peekTitle').oninput = e => { S.patch(id, { [titleKey]: e.target.value }); };

  const renderProps = () => {
    const d = S.get(id);
    $('#peekProps').innerHTML = isTpl
      ? `<span class="k">${icon('star')} Type</span><span class="v">Template de Vision${d.isDefault ? ' · par défaut' : ''}</span>`
      : `<span class="k">${icon('status')} Statut</span><button class="val" id="propStatus">${pill(statusDef(statusOf(d)))}</button>
         <span class="k">${icon('group')} Groupe</span><button class="val" id="propGroup"><span class="n-pill c-${groupDef(groupOf(d)).color}" style="border-radius:4px">${groupDef(groupOf(d)).label}</span></button>`;
    if (isTpl) return;
    $('#propStatus').onclick = e => {
      e.stopPropagation();
      openPop(e.currentTarget, STATUSES.map(st => ({ html: pill(st), checked: statusOf(S.get(id)) === st.key, onClick: () => { S.patch(id, { status: st.key }); renderProps(); } })));
    };
    $('#propGroup').onclick = e => {
      e.stopPropagation();
      openPop(e.currentTarget, GROUPS.map(g => ({ html: `<span class="n-pill c-${g.color}" style="border-radius:4px">${g.label}</span>`, checked: groupOf(S.get(id)) === g.key, onClick: () => { S.patch(id, { group: g.key }); renderProps(); } })));
    };
  };
  renderProps();

  $('#peekIcon').onclick = e => {
    e.stopPropagation();
    const pop = $('#emojiPop'), r = e.currentTarget.getBoundingClientRect();
    pop.style.left = r.left + 'px'; pop.style.top = (r.bottom + 6) + 'px';
    pop.hidden = !pop.hidden;
    pop.querySelectorAll('[data-emoji]').forEach(btn => btn.onclick = () => {
      S.patch(id, { icon: btn.dataset.emoji });
      $('#peekIcon').textContent = btn.dataset.emoji;
      pop.hidden = true;
    });
  };

  const remove = () => {
    if (isTpl && Templates.list().length === 1) return toast('Il faut garder au moins un template');
    if (!confirm(`Supprimer ${isTpl ? 'ce template' : 'cette Vision'} ? Cette action est définitive.`)) return;
    $('#drawerFrame').src = 'about:blank';   // coupe toute sauvegarde en attente dans l'iframe
    S.remove(id);
    if (isTpl && doc.isDefault) Templates.patch(Templates.list()[0].id, { isDefault: true });
    closePeek();
  };
  $('#peekMore').onclick = e => {
    e.stopPropagation();
    openPop(e.currentTarget, isTpl ? [
      ...(S.get(id).isDefault ? [] : [{ icon: 'star', label: 'Définir par défaut', onClick: () => { Templates.list().forEach(t => Templates.patch(t.id, { isDefault: t.id === id })); renderProps(); } }]),
      { icon: 'trash', label: 'Supprimer le template', danger: true, onClick: remove },
    ] : [
      { icon: 'copy', label: 'Dupliquer', onClick: () => { const c = duplicateVision(id); closePeek(); setTimeout(() => openPeek('vision', c.id), 400); } },
      { icon: 'trash', label: 'Supprimer', danger: true, onClick: remove },
    ]);
  };

  $('#drawerFrame').src = `${baseUrl()}?${isTpl ? 'template' : 'board'}=${encodeURIComponent(id)}&drawer=1&v=${APP_VERSION}`;
  $('#scrim').classList.add('open');
  $('#drawer').classList.add('open');
  $('#drawer').setAttribute('aria-hidden', 'false');
}

function closePeek() {
  if (!peek) return;
  const { kind, id, isNew } = peek;
  peek = null;
  $('#scrim').classList.remove('open');
  $('#drawer').classList.remove('open');
  $('#drawer').setAttribute('aria-hidden', 'true');
  // Comme dans Notion : une nouvelle carte sans titre n'est pas créée.
  if (isNew && kind === 'vision' && !(Store.get(id)?.title || '').trim()) {
    $('#drawerFrame').src = 'about:blank';   // coupe toute sauvegarde en attente dans l'iframe
    Store.remove(id);
    setTimeout(renderKanban, 250);
    return;
  }
  // Laisse l'iframe terminer sa sauvegarde, puis rafraîchit les cartes.
  setTimeout(() => { $('#drawerFrame').src = 'about:blank'; renderKanban(); }, 350);
}

}
