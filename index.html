<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kata Storyboard</title>
<style>
  :root {
    --frame: #1f4fb5;
    --frame-soft: #a3aedb;
    --ink: #111;
    --muted: #6b6f76;
    --line: #111;
    --paper: #fff;
    --bg: #fff;
    --hover: #f2f4fa;
    --accent: #1f4fb5;
    --danger: #b3261e;
    --active-bg: #fff6d6;
    --active-line: #f0cf6b;
    --active-ink: #b07a00;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 14px; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }

  /* ---------- Barre d'outils ---------- */
  .toolbar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 6px 10px; font-size: 12px; color: var(--muted);
  }
  .toolbar .spacer { flex: 1; }
  .toolbar a, .toolbar button {
    color: var(--muted); text-decoration: none; background: none; border: 1px solid transparent;
    border-radius: 4px; padding: 3px 7px;
  }
  .toolbar a:hover, .toolbar button:hover { background: var(--hover); color: var(--ink); }
  .status { min-width: 70px; text-align: right; }

  /* ---------- Storyboard ---------- */
  .frame {
    margin: 0 10px 10px;
    border: 3px solid var(--frame);
    padding: 10px;
    background: var(--frame-soft);
    box-shadow: inset 0 0 0 0 transparent;
  }
  .sheet {
    background: var(--paper);
    border: 3px solid var(--frame);
    padding: 0 14px 14px;
    min-height: calc(100vh - 80px);
    display: flex; flex-direction: column;
  }
  .head {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr);
    border-bottom: 3px solid var(--line);
  }
  .head > div.challenge { position: relative; flex-wrap: wrap; min-width: 0; }
  .sentence { flex: 1; min-width: 0; font-size: 16px; line-height: 1.9; }
  .head .sentence input.blank {
    flex: none; border: none; border-bottom: 1.5px dashed #9aa0a8; padding: 0;
    font-size: 16px; min-width: 3ch; max-width: 100%;
    margin: 0;
  }
  .head textarea.focus-input {
    flex: 1; min-width: 0; border: none; outline: none; resize: none; font-size: 16px;
    line-height: 1.4; padding: 2px 0; background: transparent; overflow: hidden;
  }
  .head .sentence input.blank:focus { border-bottom: 1.5px solid var(--accent); }
  .head .sentence input.blank:not(:placeholder-shown) { border-bottom-color: transparent; }
  .head .sentence input.blank:not(:placeholder-shown):focus { border-bottom-color: var(--accent); }
  .help-btn { font-size: 13px; color: var(--muted); border: 1px solid #c3c7ce; border-radius: 50%; width: 20px; height: 20px; padding: 0; line-height: 18px; background: #fff; align-self: center; }
  .help-btn:hover { color: var(--accent); border-color: var(--accent); }
  .rules {
    position: absolute; right: 8px; top: 100%; z-index: 10; width: min(520px, 90vw);
    background: #fff; border: 1px solid #c3c7ce; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.12);
    padding: 12px 14px; font-size: 13px; line-height: 1.45;
  }
  .rules[hidden] { display: none; }
  .rules table { width: 100%; border-collapse: collapse; margin: 6px 0 8px; }
  .rules th, .rules td { text-align: left; padding: 4px 6px; border-bottom: 1px solid #eceef1; vertical-align: top; }
  .rules th { font-size: 11px; text-transform: uppercase; color: var(--muted); }
  .rules .good { color: #1d7a3a; }
  .rules .bad { color: var(--danger); }
  .rules p { margin: 4px 0; }
  .head > div { padding: 14px 16px 12px; display: flex; gap: 8px; align-items: baseline; }
  .head > div + div { border-left: 3px solid var(--line); margin: 8px 0; padding-top: 6px; padding-bottom: 4px; }
  .head > div:first-child { margin: 8px 0; padding-top: 6px; padding-bottom: 4px; }
  .head label { font-weight: 700; font-size: 19px; white-space: nowrap; }
  .head input { flex: 1; min-width: 0; border: none; outline: none; font-size: 16px; padding: 2px 0; background: transparent; }

  /* Les colonnes Target / Current partagent les mêmes lignes (subgrid) :
     chaque paramètre est aligné face à son homologue. */
  .body {
    flex: 1;
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: auto auto auto 1fr auto;
    margin-top: 14px;
  }
  .col { padding: 6px 16px; display: flex; flex-direction: column; min-width: 0; }
  .col + .col { border-left: 3px solid var(--line); }
  .col.cond { grid-row: 1 / span 5; display: grid; grid-template-rows: subgrid; }
  .col.right { grid-row: 1 / span 5; }
  h2 { font-size: 19px; line-height: 1.2; margin: 4px 0 10px; font-weight: 700; }
  .achieve { display: flex; align-items: center; gap: 6px; font-weight: 700; margin: -4px 0 12px; font-size: 15px; }
  .achieve input { border: none; border-bottom: 2px solid var(--line); outline: none; padding: 2px 2px; font-weight: 400; background: transparent; }

  .metric { display: flex; flex-direction: column; padding: 8px 0; border-top: 1px dashed #d5d8de; min-width: 0; }
  .metric > span { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); margin-bottom: 3px; }
  .metric textarea {
    width: 100%; resize: none; border: none; outline: none; line-height: 1.5;
    background: transparent; padding: 2px 0; min-height: 48px; overflow: hidden;
  }
  .metric.pattern textarea { flex: 1; min-height: 120px; }
  .metric textarea::placeholder, .head input::placeholder, .obs input::placeholder, .exp textarea::placeholder { color: #b4b7bd; }

  .right { padding: 0; }
  .right > section { padding: 6px 16px; }
  .right > section.experiments { flex: 1.3; }
  .right > section.obstacles { flex: 1; border-top: 3px solid var(--line); margin-left: 8px; padding-left: 8px; padding-top: 14px; }

  /* Experimenting record */
  .exp { border: 1px solid #d5d8de; border-radius: 4px; margin-bottom: 8px; background: #fff; }
  .exp-head { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-bottom: 1px solid #e6e8ec; background: #fafbfc; font-size: 12px; }
  .exp-head .num { font-weight: 700; }
  .exp-head input { border: none; outline: none; background: transparent; font-size: 12px; min-width: 0; }
  .exp-head .spacer { flex: 1; }
  .exp-grid { display: grid; grid-template-columns: 1fr; }
  .exp-field { display: grid; grid-template-columns: 70px 1fr; border-top: 1px solid #eef0f3; }
  .exp-field:first-child { border-top: none; }
  .exp-field span { font-size: 11px; color: var(--muted); padding: 5px 6px; text-transform: uppercase; letter-spacing: .02em; }
  .exp textarea { border: none; outline: none; resize: none; padding: 4px 6px; min-height: 26px; line-height: 1.4; background: transparent; width: 100%; }

  .icon { background: none; border: none; color: var(--muted); padding: 2px 5px; border-radius: 3px; line-height: 1; }
  .icon:hover { background: var(--hover); color: var(--ink); }
  .icon.del:hover { color: var(--danger); }
  .add { background: none; border: 1px dashed #c3c7ce; border-radius: 4px; color: var(--muted); padding: 5px 8px; font-size: 12px; width: 100%; text-align: left; }
  .add:hover { border-color: var(--accent); color: var(--accent); }

  /* Block diagrams As Is / To Be */
  .diagram { border-top: 1px dashed #d5d8de; padding: 8px 0 4px; min-width: 0; }
  .diagram-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 8px; min-height: 22px; }
  .diagram-head > span { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
  .diagram-head button { font-size: 11px; padding: 2px 7px; border: 1px solid #c3c7ce; border-radius: 4px; background: #fff; color: var(--muted); }
  .diagram-head button:hover { border-color: var(--accent); color: var(--accent); }
  .blk {
    position: relative; display: flex; align-items: center; gap: 6px;
    border: 2px solid var(--ink); border-radius: 3px; padding: 5px 8px; background: #fff; min-width: 0;
  }
  .blk.obstacle { border-color: var(--danger); background: #fdf3f2; }
  .blk .warn { color: var(--danger); font-size: 13px; }
  .blk input { border: none; outline: none; background: transparent; min-width: 0; padding: 1px 0; }
  .blk .blk-name { flex: 1; font-weight: 700; }
  .blk .blk-val { width: 34%; text-align: right; color: #333; }
  .blk input::placeholder, .conn input::placeholder { color: #b4b7bd; font-weight: 400; }
  .blk-tools {
    position: absolute; right: 4px; top: -13px; display: none; gap: 1px;
    background: #fff; border: 1px solid #c3c7ce; border-radius: 4px; padding: 1px; z-index: 2;
  }
  .blk:hover .blk-tools, .blk:focus-within .blk-tools { display: flex; }
  .blk-tools button { border: none; background: none; font-size: 11px; line-height: 1; padding: 3px 5px; border-radius: 3px; color: var(--muted); }
  .blk-tools button:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
  .blk-tools button:disabled { opacity: .3; cursor: default; }
  .blk-tools button.on { color: var(--danger); }
  .conn { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 26px; }
  .conn .down { font-size: 16px; line-height: 1; color: var(--ink); }
  .conn .side { display: flex; align-items: center; gap: 3px; padding-left: 8px; min-width: 0; font-size: 12px; }
  .conn .tri { color: #d08700; }
  .conn .side input { width: 60px; min-width: 0; border: none; border-bottom: 1px dashed #c3c7ce; outline: none; background: transparent; font-size: 12px; padding: 1px 0; }
  .conn .side button { border: none; background: none; color: var(--muted); font-size: 11px; padding: 2px 4px; border-radius: 3px; }
  .conn .side button:hover { background: var(--hover); color: var(--ink); }
  .conn .add-wait { visibility: hidden; }
  .conn:hover .add-wait, .conn .add-wait:focus { visibility: visible; }
  .diagram .add { margin-top: 8px; }
  .diagram .add:disabled { opacity: .5; cursor: default; }

  /* Obstacle en cours, en tête du Record */
  .rec-obs {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    background: var(--active-bg); border: 1px solid var(--active-line); border-radius: 4px;
    padding: 6px 8px; margin-bottom: 10px; font-size: 13px;
  }
  .rec-obs.none { background: #f6f7f9; border-color: #d5d8de; }
  .rec-obs strong { white-space: nowrap; }
  .rec-obs select { flex: 1; min-width: 120px; font: inherit; padding: 3px 4px; border: 1px solid #c3c7ce; border-radius: 4px; background: #fff; }
  .rec-obs button { font-size: 12px; padding: 3px 8px; border: 1px solid #1d7a3a; color: #1d7a3a; background: #fff; border-radius: 4px; white-space: nowrap; }
  .rec-obs button:hover { background: #1d7a3a; color: #fff; }
  .hint { color: var(--muted); font-size: 12px; font-style: italic; margin: 4px 0 10px; }

  .archive { margin-top: 12px; font-size: 12px; }
  .archive summary { cursor: pointer; color: var(--muted); padding: 3px 0; }
  .archive summary:hover { color: var(--ink); }
  .arch-group { border-left: 3px solid #d5d8de; padding: 4px 0 4px 8px; margin: 8px 0; }
  .arch-group .arch-title { font-weight: 700; }
  .arch-group .badge { font-weight: 400; font-size: 11px; color: var(--muted); border: 1px solid #d5d8de; border-radius: 8px; padding: 0 6px; margin-left: 4px; }
  .arch-group .badge.lifted { color: #1d7a3a; border-color: #9fd0ae; }
  .arch-group ol { margin: 4px 0 0; padding-left: 18px; }
  .arch-group li { margin: 2px 0; }
  .arch-group .learned { color: var(--muted); }

  /* Obstacles */
  .obs { display: flex; align-items: center; gap: 4px; padding: 2px 4px; border-radius: 4px; border: 1px solid transparent; }
  .obs input[type=text] { flex: 1; border: none; outline: none; padding: 3px 2px; background: transparent; min-width: 0; }
  .obs.done input[type=text] { text-decoration: line-through; color: var(--muted); }
  .obs .arrow { color: #c9ccd2; font-size: 15px; }
  .obs .arrow:disabled { visibility: hidden; }
  .obs.focus { background: var(--active-bg); border-color: var(--active-line); }
  .obs.focus .arrow { color: var(--active-ink); }
  .obs.focus input[type=text] { font-weight: 700; }
  .list { margin-bottom: 8px; }

  /* ---------- Kanban (style Notion) ---------- */
  body.kanban-page {
    --n-ink: rgb(55, 53, 47); --n-muted: rgba(55, 53, 47, .65); --n-faint: rgba(55, 53, 47, .45);
    --n-line: rgba(55, 53, 47, .09); --n-hover: rgba(55, 53, 47, .06);
    --n-blue: #2383e2;
    background: #fff; color: var(--n-ink); min-height: 100vh;
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI Variable Display", "Segoe UI", Helvetica, "Apple Color Emoji", Arial, sans-serif;
  }
  .n-page { padding: 28px 40px 40px; }
  .n-title { font-size: 32px; font-weight: 700; margin: 0 0 14px; letter-spacing: -.01em; }
  .n-bar { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--n-line); padding-bottom: 6px; margin-bottom: 12px; }
  .n-tab { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; padding: 5px 10px; border-radius: 16px; background: var(--n-hover); }
  .n-bar .spacer { flex: 1; }
  .n-icon-btn { border: none; background: none; color: var(--n-faint); font-size: 15px; padding: 4px 7px; border-radius: 4px; line-height: 1; }
  .n-icon-btn:hover { background: var(--n-hover); color: var(--n-ink); }

  .n-new { position: relative; display: inline-flex; margin-left: 6px; }
  .n-new button { border: none; background: var(--n-blue); color: #fff; font-size: 14px; font-weight: 500; padding: 5px 10px; }
  .n-new button:hover { background: #0077d4; }
  .n-new .main { border-radius: 6px 0 0 6px; }
  .n-new .caret { border-radius: 0 6px 6px 0; border-left: 1px solid rgba(255,255,255,.35); padding: 5px 7px; }

  .n-menu {
    position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; width: 300px;
    background: #fff; border-radius: 10px; padding: 6px;
    box-shadow: rgba(15,15,15,.05) 0 0 0 1px, rgba(15,15,15,.1) 0 3px 6px, rgba(15,15,15,.2) 0 9px 24px;
  }
  .n-menu[hidden] { display: none; }
  .n-menu .label { font-size: 12px; color: var(--n-muted); padding: 6px 8px 4px; font-weight: 500; }
  .n-menu .row { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; font-size: 14px; cursor: pointer; }
  .n-menu .row:hover { background: var(--n-hover); }
  .n-menu .row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .n-menu .row .default { font-size: 11px; color: var(--n-muted); background: var(--n-hover); border-radius: 4px; padding: 1px 5px; }
  .n-menu .row .tools { display: none; gap: 1px; }
  .n-menu .row:hover .tools { display: flex; }
  .n-menu .row .tools button { border: none; background: none; color: var(--n-faint); font-size: 13px; padding: 2px 4px; border-radius: 4px; }
  .n-menu .row .tools button:hover { background: rgba(55,53,47,.12); color: var(--n-ink); }
  .n-menu hr { border: none; border-top: 1px solid var(--n-line); margin: 5px 0; }
  .n-menu .row.new-tpl { color: var(--n-muted); }

  .n-board { display: grid; grid-auto-flow: column; grid-auto-columns: 272px; gap: 14px; overflow-x: auto; padding-bottom: 12px; align-items: start; }
  .n-col { border-radius: 10px; padding: 6px 8px 8px; background: var(--col-bg); min-height: 200px; display: flex; flex-direction: column; gap: 8px; }
  .n-col.drop { box-shadow: inset 0 0 0 2px var(--col-dot); }
  .n-col-head { display: flex; align-items: center; gap: 8px; padding: 4px 2px 2px; font-size: 14px; }
  .n-pill { display: inline-flex; align-items: center; gap: 6px; background: var(--col-pill); color: var(--col-text); border-radius: 12px; padding: 1px 9px 1px 7px; font-weight: 500; white-space: nowrap; }
  .n-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--col-dot); }
  .n-col-head .count { color: var(--col-dot); font-size: 14px; }

  .n-card {
    background: #fff; border-radius: 10px; padding: 10px 12px; cursor: pointer; min-width: 0;
    box-shadow: rgba(15,15,15,.1) 0 0 0 1px, rgba(15,15,15,.1) 0 2px 4px;
  }
  .n-card:hover { background: #fafaf9; }
  .n-card.dragging { opacity: .4; }
  .n-card .t { display: flex; gap: 7px; align-items: flex-start; font-size: 14px; font-weight: 500; line-height: 1.4; overflow-wrap: anywhere; }
  .n-card .t .ico { flex: none; width: 20px; text-align: center; }
  .n-card .t .untitled { color: var(--n-faint); }
  .n-card .prop { font-size: 12px; color: var(--n-muted); line-height: 1.45; margin-top: 7px;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .n-card .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .n-chip { font-size: 12px; border-radius: 4px; padding: 1px 6px; background: var(--n-hover); color: var(--n-ink); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .n-chip.obs { background: rgb(253, 236, 200); color: rgb(64, 44, 27); }
  .n-add { border: none; background: none; text-align: left; color: var(--col-dot); font-size: 14px; padding: 6px 8px; border-radius: 8px; }
  .n-add:hover { background: rgba(55,53,47,.06); }

  /* Couleurs Notion par statut */
  .c-gray   { --col-bg: rgb(249, 249, 248); --col-pill: rgb(227, 226, 224); --col-text: rgb(50, 48, 44); --col-dot: rgb(145, 145, 142); }
  .c-blue   { --col-bg: rgb(246, 250, 252); --col-pill: rgb(211, 229, 239); --col-text: rgb(24, 51, 71);  --col-dot: rgb(51, 126, 169); }
  .c-yellow { --col-bg: rgb(252, 250, 243); --col-pill: rgb(253, 236, 200); --col-text: rgb(64, 44, 27);  --col-dot: rgb(203, 145, 47); }
  .c-green  { --col-bg: rgb(246, 250, 247); --col-pill: rgb(219, 237, 219); --col-text: rgb(28, 56, 41);  --col-dot: rgb(68, 131, 97); }

  /* Tiroir (side peek) */
  .scrim { position: fixed; inset: 0; background: rgba(15,15,15,.25); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(1180px, 94vw); background: #fff; z-index: 21;
    transform: translateX(100%); transition: transform .25s ease; display: flex; flex-direction: column;
    box-shadow: rgba(15,15,15,.05) 0 0 0 1px, rgba(15,15,15,.1) 0 3px 6px, rgba(15,15,15,.2) 0 9px 24px;
  }
  .drawer:not(.open) { box-shadow: none; }
  .drawer.open { transform: none; }
  .peek-top { display: flex; align-items: center; gap: 4px; padding: 8px 12px; }
  .peek-top .spacer { flex: 1; }
  .peek-banner { margin: 0 44px 6px; background: rgb(251, 243, 219); color: rgb(64, 44, 27); border-radius: 6px; padding: 7px 12px; font-size: 13px; }
  .peek-banner[hidden] { display: none; }
  .peek-head { padding: 4px 44px 8px; }
  .peek-icon { font-size: 40px; line-height: 1; border: none; background: none; padding: 4px; border-radius: 6px; margin-left: -4px; }
  .peek-icon:hover { background: var(--n-hover); }
  .peek-title { display: block; width: 100%; border: none; outline: none; font: inherit; font-size: 30px; font-weight: 700; color: var(--n-ink); padding: 4px 0; background: transparent; }
  .peek-title::placeholder { color: rgba(55,53,47,.2); }
  .peek-props { display: grid; grid-template-columns: 140px 1fr; gap: 2px 8px; font-size: 14px; margin-top: 6px; align-items: center; }
  .peek-props .k { color: var(--n-muted); padding: 5px 0; }
  .peek-props select { font: inherit; border: none; background: var(--n-hover); border-radius: 4px; padding: 3px 6px; color: var(--n-ink); justify-self: start; }
  .peek-props .v { color: var(--n-ink); padding: 5px 0; }
  .drawer iframe { flex: 1; border: 0; width: 100%; border-top: 1px solid var(--n-line); }

  .emoji-pop { position: absolute; z-index: 31; display: grid; grid-template-columns: repeat(8, 32px); gap: 2px; padding: 8px; background: #fff; border-radius: 10px;
    box-shadow: rgba(15,15,15,.05) 0 0 0 1px, rgba(15,15,15,.1) 0 3px 6px, rgba(15,15,15,.2) 0 9px 24px; }
  .emoji-pop[hidden] { display: none; }
  .emoji-pop button { border: none; background: none; font-size: 20px; padding: 3px; border-radius: 6px; }
  .emoji-pop button:hover { background: var(--n-hover); }

  @media (max-width: 700px) {
    .n-page { padding: 18px 14px 30px; }
    .peek-head, .peek-banner { padding-left: 16px; padding-right: 16px; margin-left: 0; margin-right: 0; }
    .drawer { width: 100vw; }
  }

  .toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: #222; color: #fff; padding: 8px 14px; border-radius: 6px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 900px) and (min-width: 521px) {
    .body { grid-template-columns: 1fr 1fr; }

</style>

<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Stockage — tout passe par ces 4 fonctions.
   Pour passer à un stockage partagé plus tard, seul ce bloc change.
   ============================================================ */
function makeStore(prefix) {
  return {
    prefix,
    list() {
      const out = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k.startsWith(prefix)) {
          try { out.push(JSON.parse(localStorage.getItem(k))); } catch (e) {}
        }
      }
      return out.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    },
    get(id) {
      try { return JSON.parse(localStorage.getItem(prefix + id)); } catch (e) { return null; }
    },
    save(doc) {
      doc.updatedAt = Date.now();
      localStorage.setItem(prefix + doc.id, JSON.stringify(doc));
    },
    remove(id) { localStorage.removeItem(prefix + id); },
    // Modifie quelques champs à partir de la version stockée (évite d'écraser le reste).
    patch(id, fields) {
      const doc = this.get(id);
      if (doc) { Object.assign(doc, fields); this.save(doc); }
      return doc;
    },
  };
}
const Store = makeStore('kata-sb:');        // Visions (cartes du Kanban)
const Templates = makeStore('kata-tpl:');   // Templates de Vision

/* ============================================================
   Utilitaires
   ============================================================ */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 8);
const slug = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
  .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40);
const baseUrl = () => location.href.split('?')[0].split('#')[0];
const boardUrl = id => `${baseUrl()}?board=${encodeURIComponent(id)}`;
const fmtDate = ts => ts ? new Date(ts).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }) : '—';

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 1800);
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast('URL copiée'); }
  catch (e) { prompt('Copiez cette URL :', text); }
}

function newBoard(id, title) {
  return {
    id, title: title || id,
    focusProcess: '', challengeBy: '', challengeResult: '', challengeVision: '',
    targetDate: '',
    target: emptyCondition(), current: emptyCondition(),
    experiments: [], obstacles: [],
    createdAt: Date.now(), updatedAt: Date.now(),
  };
}

// Target et Current ont la même structure : c'est ce qui rend l'écart lisible.
const CONDITION_FIELDS = [
  { key: 'outcome', label: 'Outcome metric',    target: 'Résultat visé, chiffré…',                 current: 'Résultat mesuré aujourd\'hui…' },
  { key: 'process', label: 'Process metric',    target: 'Indicateur de process visé…',            current: 'Indicateur de process aujourd\'hui…' },
  { key: 'pattern', label: 'Operating pattern', target: 'Comment le processus doit fonctionner…', current: 'Comment le processus fonctionne aujourd\'hui…' },
];
function emptyCondition() { return { outcome: '', process: '', pattern: '' }; }

// Remet à niveau un storyboard créé avec une version précédente.
function migrate(b) {
  if (b.challenge && !b.challengeResult) b.challengeResult = b.challenge;
  delete b.challenge;
  for (const side of ['target', 'current']) {
    if (typeof b[side] !== 'object' || !b[side]) b[side] = { ...emptyCondition(), pattern: b[side] || '' };
  }
  b.target.toBe ||= [];
  b.current.asIs ||= [];
  const active = b.obstacles.find(o => o.focus && !o.done);
  b.experiments.forEach(x => {
    if (x.obstacleId === undefined) x.obstacleId = active ? active.id : null;
  });
  return b;
}

const getPath = (obj, path) => path.split('.').reduce((o, k) => o?.[k], obj);
function setPath(obj, path, value) {
  const keys = path.split('.');
  const last = keys.pop();
  keys.reduce((o, k) => o[k], obj)[last] = value;
}

function autoGrow(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }

// Élargit un trou de la phrase Challenge à la taille de son texte (ou du placeholder).
const measureCtx = document.createElement('canvas').getContext('2d');
function fitWidth(el) {
  const cs = getComputedStyle(el);
  measureCtx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  el.style.width = Math.ceil(measureCtx.measureText(el.value || el.placeholder).width) + 1 + 'px';
}

/* ============================================================
   Routage : ?board=<id> → storyboard, sinon → liste
   ============================================================ */
const params = new URLSearchParams(location.search);
const inDrawer = params.has('drawer');
// L'éditeur de storyboard sert aux Visions comme aux templates : seul le stockage change.
let DocStore = Store;

function route() {
  if (params.get('template')) { DocStore = Templates; renderBoard(params.get('template')); }
  else if (params.get('board')) renderBoard(params.get('board'));
  else renderKanban();
}

/* ============================================================
   Vue Kanban — chaque carte est une Vision, qui porte un storyboard
   ============================================================ */
const STATUSES = [
  { key: 'todo',   label: 'À démarrer', color: 'gray' },
  { key: 'doing',  label: 'En cours',   color: 'blue' },
  { key: 'paused', label: 'En pause',   color: 'yellow' },
  { key: 'done',   label: 'Atteint',    color: 'green' },
];
const EMOJIS = ['🧭','🌱','🏃','🎹','💼','🏭','☀️','📚','🧠','💪','🎯','🚀','🧘','✍️','🎨','🛠️','💡','🌍','❤️','🏔️','⛵','🎸','📈','🧩'];
const statusOf = b => STATUSES.some(s => s.key === b.status) ? b.status : 'todo';

function challengeText(b) {
  if (!b.challengeResult) return '';
  return `D'ici ${b.challengeBy || '…'}, ${b.challengeResult}.`;
}

function renderKanban() {
  document.title = 'Visions';
  document.body.classList.add('kanban-page');
  if (!Store.list().length && !localStorage.getItem('kata-demo-seeded')) seedDemo();
  if (!Templates.list().length) seedTemplates();
  const boards = Store.list();

  $('#app').innerHTML = `
    <div class="n-page">
      <h1 class="n-title">Visions</h1>
      <div class="n-bar">
        <span class="n-tab">▦ Board</span>
        <span class="spacer"></span>
        <button class="n-icon-btn" id="export" title="Exporter (JSON)">⤓</button>
        <button class="n-icon-btn" id="resetDemo" title="Réinitialiser la démo">⟲</button>
        <div class="n-new">
          <button class="main" id="newMain" title="Nouvelle Vision avec le template par défaut">New</button>
          <button class="caret" id="newCaret" title="Choisir un template">▾</button>
          <div class="n-menu" id="tplMenu" hidden></div>
        </div>
      </div>
      <div class="n-board">
        ${STATUSES.map(st => {
          const cards = boards.filter(b => statusOf(b) === st.key);
          return `
            <div class="n-col c-${st.color}" data-status="${st.key}">
              <div class="n-col-head"><span class="n-pill"><span class="dot"></span>${st.label}</span><span class="count">${cards.length}</span></div>
              ${cards.map(visionCard).join('')}
              <button class="n-add" data-new="${st.key}">+ Nouvelle page</button>
            </div>`;
        }).join('')}
      </div>
    </div>
    <div class="scrim" id="scrim"></div>
    <aside class="drawer" id="drawer" aria-hidden="true">
      <div class="peek-top">
        <button class="n-icon-btn" id="drawerClose" title="Fermer (Échap)">»</button>
        <span class="spacer"></span>
        <button class="n-icon-btn" id="drawerDelete" title="Supprimer">🗑</button>
      </div>
      <div class="peek-banner" id="peekBanner" hidden>Vous modifiez un template. Les nouvelles Visions créées avec ce template reprendront ce contenu.</div>
      <div class="peek-head">
        <button class="peek-icon" id="peekIcon" title="Changer l'icône"></button>
        <input class="peek-title" id="peekTitle" placeholder="Sans titre" autocomplete="off">
        <div class="peek-props" id="peekProps"></div>
      </div>
      <iframe id="drawerFrame" title="Storyboard"></iframe>
    </aside>
    <div class="emoji-pop" id="emojiPop" hidden>${EMOJIS.map(e => `<button data-emoji="${e}">${e}</button>`).join('')}</div>`;

  // Cartes : ouverture + glisser-déposer
  $('#app').querySelectorAll('.n-card').forEach(card => {
    card.onclick = () => openPeek('vision', card.dataset.id);
    card.ondragstart = e => { e.dataTransfer.setData('text/plain', card.dataset.id); card.classList.add('dragging'); };
    card.ondragend = () => card.classList.remove('dragging');
  });
  $('#app').querySelectorAll('.n-col').forEach(col => {
    col.ondragover = e => { e.preventDefault(); col.classList.add('drop'); };
    col.ondragleave = () => col.classList.remove('drop');
    col.ondrop = e => {
      e.preventDefault();
      Store.patch(e.dataTransfer.getData('text/plain'), { status: col.dataset.status });
      renderKanban();
    };
  });
  $('#app').querySelectorAll('[data-new]').forEach(btn => btn.onclick = () => createVision(defaultTemplate(), btn.dataset.new));

  // Bouton New + menu des templates
  $('#newMain').onclick = () => createVision(defaultTemplate(), 'todo');
  $('#newCaret').onclick = e => { e.stopPropagation(); toggleTemplateMenu(); };

  $('#export').onclick = () => {
    const data = { visions: Store.list(), templates: Templates.list() };
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
    a.download = `visions-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
  };
  $('#resetDemo').onclick = () => {
    if (!confirm('Remplacer toutes les Visions et tous les templates par les données de démo ?')) return;
    Store.list().forEach(b => Store.remove(b.id));
    Templates.list().forEach(t => Templates.remove(t.id));
    seedDemo(); seedTemplates(); renderKanban();
  };

  $('#scrim').onclick = closePeek;
  $('#drawerClose').onclick = closePeek;
  $('#emojiPop').onclick = e => e.stopPropagation();
  document.onclick = () => { $('#tplMenu').hidden = true; $('#emojiPop').hidden = true; };
  document.onkeydown = e => { if (e.key === 'Escape') { $('#emojiPop').hidden = true; $('#tplMenu').hidden = true; closePeek(); } };
}

function visionCard(b) {
  const active = (b.obstacles || []).find(o => o.focus && !o.done);
  const due = b.targetDate ? new Date(b.targetDate + 'T00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }) : '';
  const nExp = (b.experiments || []).length;
  return `
    <div class="n-card" draggable="true" data-id="${esc(b.id)}">
      <div class="t"><span class="ico">${esc(b.icon || '🧭')}</span>${b.title ? `<span>${esc(b.title)}</span>` : '<span class="untitled">Sans titre</span>'}</div>
      ${challengeText(b) ? `<div class="prop">${esc(challengeText(b))}</div>` : ''}
      ${(active || due || nExp) ? `<div class="chips">
        ${active ? `<span class="n-chip obs" title="Obstacle en cours">➜ ${esc(active.text)}</span>` : ''}
        ${due ? `<span class="n-chip" title="Target Condition">🎯 ${esc(due)}</span>` : ''}
        ${nExp ? `<span class="n-chip">${nExp} exp.</span>` : ''}
      </div>` : ''}
    </div>`;
}

/* ---------- Templates ---------- */
const defaultTemplate = () => Templates.list().find(t => t.isDefault) || Templates.list()[0];

function toggleTemplateMenu() {
  const menu = $('#tplMenu');
  if (!menu.hidden) { menu.hidden = true; return; }
  const tpls = Templates.list();
  menu.innerHTML = `
    <div class="label">Templates de Vision</div>
    ${tpls.map(t => `
      <div class="row" data-tpl="${esc(t.id)}">
        <span>${esc(t.icon || '🧭')}</span>
        <span class="name">${esc(t.name || 'Template sans nom')}</span>
        ${t.isDefault ? '<span class="default">Par défaut</span>' : ''}
        <span class="tools">
          ${t.isDefault ? '' : '<button data-act="default" title="Définir par défaut">★</button>'}
          <button data-act="edit" title="Modifier">✎</button>
          <button data-act="dup" title="Dupliquer">⧉</button>
          <button data-act="del" title="Supprimer">🗑</button>
        </span>
      </div>`).join('')}
    <hr>
    <div class="row new-tpl" id="tplAdd">+ Nouveau template</div>`;
  menu.hidden = false;
  menu.onclick = e => e.stopPropagation();

  menu.querySelectorAll('[data-tpl]').forEach(row => {
    const id = row.dataset.tpl;
    row.onclick = e => {
      const act = e.target.dataset.act;
      menu.hidden = true;
      if (!act) return createVision(Templates.get(id), 'todo');
      if (act === 'edit') return openPeek('template', id);
      if (act === 'default') Templates.list().forEach(t => Templates.patch(t.id, { isDefault: t.id === id }));
      if (act === 'dup') {
        const src = Templates.get(id);
        Templates.save({ ...src, id: 'tpl-' + uid() + uid(), name: `${src.name} (copie)`, isDefault: false, createdAt: Date.now() });
      }
      if (act === 'del') {
        if (Templates.list().length === 1) return toast('Il faut garder au moins un template');
        if (!confirm(`Supprimer le template « ${Templates.get(id).name} » ?`)) return;
        const wasDefault = Templates.get(id).isDefault;
        Templates.remove(id);
        if (wasDefault) Templates.patch(Templates.list()[0].id, { isDefault: true });
      }
      toggleTemplateMenu();
    };
  });
  $('#tplAdd').onclick = () => {
    menu.hidden = true;
    const id = 'tpl-' + uid() + uid();
    Templates.save({ ...newBoard(id, ''), name: 'Nouveau template', icon: '🧭', isDefault: false });
    openPeek('template', id);
  };
}

// Crée une Vision à partir d'un template : copie profonde + nouveaux identifiants.
function createVision(tpl, status) {
  const b = JSON.parse(JSON.stringify(tpl || newBoard('')));
  const idMap = {};
  delete b.name; delete b.isDefault;
  Object.assign(b, { id: 'v-' + uid() + uid(), status, title: '', createdAt: Date.now() });
  b.obstacles = (b.obstacles || []).map(o => { const id = uid(); idMap[o.id] = id; return { ...o, id }; });
  b.experiments = (b.experiments || []).map(x => ({ ...x, id: uid(), obstacleId: idMap[x.obstacleId] ?? null }));
  ['target', 'current'].forEach(side => {
    const key = side === 'target' ? 'toBe' : 'asIs';
    if (b[side]?.[key]) b[side][key] = b[side][key].map(k => ({ ...k, id: uid() }));
  });
  Store.save(b);
  renderKanban();
  openPeek('vision', b.id);
  setTimeout(() => $('#peekTitle').focus(), 280);
}

/* ---------- Tiroir (side peek) ---------- */
let peek = null;   // { kind: 'vision' | 'template', id }

function openPeek(kind, id) {
  const S = kind === 'template' ? Templates : Store;
  const doc = S.get(id);
  if (!doc) return;
  peek = { kind, id };
  const isTpl = kind === 'template';

  $('#peekBanner').hidden = !isTpl;
  $('#peekIcon').textContent = doc.icon || '🧭';
  const titleKey = isTpl ? 'name' : 'title';
  $('#peekTitle').value = doc[titleKey] || '';
  $('#peekTitle').placeholder = isTpl ? 'Nom du template' : 'Sans titre';
  $('#peekTitle').oninput = e => { S.patch(id, { [titleKey]: e.target.value }); };

  $('#peekProps').innerHTML = isTpl
    ? `<span class="k">Type</span><span class="v">Template de Vision${doc.isDefault ? ' · par défaut' : ''}</span>`
    : `<span class="k">◉ Statut</span>
       <select id="peekStatus">${STATUSES.map(s => `<option value="${s.key}" ${statusOf(doc) === s.key ? 'selected' : ''}>${s.label}</option>`).join('')}</select>`;
  if (!isTpl) $('#peekStatus').onchange = e => S.patch(id, { status: e.target.value });

  $('#peekIcon').onclick = e => {
    e.stopPropagation();
    const pop = $('#emojiPop'), r = e.currentTarget.getBoundingClientRect();
    pop.style.left = r.left + 'px'; pop.style.top = (r.bottom + 6) + 'px';
    pop.hidden = !pop.hidden;
    pop.querySelectorAll('[data-emoji]').forEach(btn => btn.onclick = () => {
      S.patch(id, { icon: btn.dataset.emoji });
      $('#peekIcon').textContent = btn.dataset.emoji;
      pop.hidden = true;
    });
  };

  $('#drawerDelete').title = isTpl ? 'Supprimer le template' : 'Supprimer la Vision';
  $('#drawerDelete').onclick = () => {
    if (isTpl && Templates.list().length === 1) return toast('Il faut garder au moins un template');
    if (!confirm(`Supprimer ${isTpl ? 'ce template' : 'cette Vision'} ? Cette action est définitive.`)) return;
    $('#drawerFrame').src = 'about:blank';   // coupe toute sauvegarde en attente dans l'iframe
    S.remove(id);
    if (isTpl && doc.isDefault) Templates.patch(Templates.list()[0].id, { isDefault: true });
    closePeek();
  };

  $('#drawerFrame').src = `${baseUrl()}?${isTpl ? 'template' : 'board'}=${encodeURIComponent(id)}&drawer=1`;
  $('#scrim').classList.add('open');
  $('#drawer').classList.add('open');
  $('#drawer').setAttribute('aria-hidden', 'false');
}

function closePeek() {
  if (!peek) return;
  peek = null;
  $('#scrim').classList.remove('open');
  $('#drawer').classList.remove('open');
  $('#drawer').setAttribute('aria-hidden', 'true');
  // Laisse l'iframe terminer sa sauvegarde, puis rafraîchit les cartes.
  setTimeout(() => { $('#drawerFrame').src = 'about:blank'; renderKanban(); }, 350);
}

/* ============================================================
   Données de démo
   ============================================================ */
function seedTemplates() {
  const blk = (name, value) => ({ id: uid(), name, value, isObstacle: false });
  const base = (id, fields) => ({ ...newBoard(id, ''), ...fields });
  Templates.save(base('tpl-vide', { name: 'Vision vide', icon: '🧭', isDefault: true, createdAt: 1 }));
  Templates.save(base('tpl-habitude', {
    name: 'Vision perso – habitude', icon: '🌱', isDefault: false, createdAt: 2,
    focusProcess: 'Routine quotidienne',
    target:  { outcome: '', process: 'Routine réalisée X jours / 7', pattern: '', toBe: [] },
    current: { outcome: '', process: 'Routine réalisée … jours / 7', pattern: '', asIs: [blk('Déclencheur', ''), blk('Routine', ''), blk('Récompense', '')] },
  }));
  Templates.save(base('tpl-process', {
    name: 'Vision pro – process', icon: '🏭', isDefault: false, createdAt: 3,
    target:  { outcome: 'Lead time : …', process: '', pattern: '', toBe: [] },
    current: { outcome: 'Lead time : …', process: '', pattern: '', asIs: [blk('Entrée', ''), blk('Traitement', ''), blk('Contrôle', ''), blk('Sortie', '')] },
  }));
}

function seedDemo() {
  localStorage.setItem('kata-demo-seeded', '1');
  const d = n => { const x = new Date(); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10); };
  const blk = (name, value, extra = {}) => ({ id: uid(), name, value, isObstacle: false, ...extra });
  const exp = (obstacleId, date, step, expect, happened, learned) => ({ id: uid(), obstacleId, date: d(date), step, expect, happened, learned });
  let order = 0;
  const vision = v => Store.save({ ...newBoard(v.id, v.title), experiments: [], obstacles: [], createdAt: ++order, ...v });

  vision({
    id: 'demo-marathon', icon: '🏃', title: 'Vivre en athlète d\'endurance', status: 'doing',
    focusProcess: 'Plan d\'entraînement hebdomadaire',
    challengeBy: 'avril 2027', challengeResult: 'finir un marathon en moins de 3h00', challengeVision: 'vivre en athlète d\'endurance',
    targetDate: d(28),
    target:  { outcome: 'Semi-marathon en 1h35', process: '4 sorties / semaine tenues 4 semaines de suite', pattern: 'Sortie longue le dimanche, fractionné le mardi, 2 footings lents.',
      toBe: [blk('Échauffement', '15 min'), blk('Fractionné', '8 × 400 m'), blk('Retour au calme', '10 min')] },
    current: { outcome: '10 km en 46 min', process: '2 sorties / semaine en moyenne', pattern: 'Sorties au feeling, souvent annulées le soir.',
      asIs: [blk('Décision de sortir', 'le soir', { isObstacle: true, waitAfter: '1 h' }), blk('Footing', '45 min'), blk('Étirements', '0 min', { isObstacle: true })] },
    obstacles: [
      { id: 'o-m-1', text: 'Sorties du soir annulées après le travail', done: true, focus: false },
      { id: 'o-m-2', text: 'Pas d\'allure cible pour le fractionné', done: false, focus: true },
      { id: 'o-m-3', text: 'Douleur au mollet après 15 km', done: false, focus: false },
    ],
    experiments: [
      exp('o-m-1', -14, 'Sortir à 7 h avant le travail', '3 sorties cette semaine', '3 sorties', 'Le matin tient, le soir non'),
      exp('o-m-2', -3, 'Fractionné à 4:10 / km', 'Tenir les 8 répétitions', '6 répétitions', 'Allure trop ambitieuse, viser 4:20'),
      exp('o-m-2', -1, 'Fractionné à 4:20 / km', 'Tenir les 8 répétitions', '', ''),
    ],
  });
  vision({
    id: 'demo-piano', icon: '🎹', title: 'Jouer du piano pour le plaisir, sans partition', status: 'doing',
    focusProcess: 'Séance de pratique quotidienne',

/* ============================================================
   Vue storyboard
   ============================================================ */
let board, saveTimer;
// Champs édités par le Kanban / le tiroir, jamais par l'éditeur de storyboard.
const SHELL_FIELDS = ['title', 'icon', 'status', 'name', 'isDefault'];

function scheduleSave() {
  $('#status').textContent = '…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const stored = DocStore.get(board.id);
    if (stored) SHELL_FIELDS.forEach(k => { if (k in stored) board[k] = stored[k]; else delete board[k]; });
    DocStore.save(board);
    $('#status').textContent = 'Enregistré';
  }, 300);
}

function renderBoard(id) {
  // Un id inconnu crée le storyboard : dupliquer un embed et changer l'id suffit.
  board = migrate(DocStore.get(id) || newBoard(id));
  document.title = board.title || 'Kata Storyboard';

  $('#app').innerHTML = `
    <div class="toolbar">
      ${inDrawer ? '' : `
        <a href="${esc(baseUrl())}">☰ Kanban</a>
        <span>·</span>
        <strong style="color:var(--ink)">${esc(board.title)}</strong>`}
      <span class="spacer"></span>
      <span class="status" id="status"></span>
    </div>
    <div class="frame">
      <div class="sheet">
        <div class="head">
          <div><label for="focusProcess">Focus Process:</label><textarea class="focus-input" id="focusProcess" data-field="focusProcess" rows="1"></textarea></div>
          <div class="challenge">
            <label for="challengeBy">Challenge:</label>
            <div class="sentence">
              D'ici <input class="blank" id="challengeBy" data-field="challengeBy" placeholder="avril 2027">, <input class="blank" data-field="challengeResult" placeholder="résultat mesurable">, afin de <input class="blank" data-field="challengeVision" placeholder="lien avec la Vision">.
            </div>
            <button class="help-btn" id="helpBtn" title="Règles d'un bon Challenge">i</button>
            <div class="rules" id="rules" hidden>
              <strong>4 règles pour valider la phrase</strong>
              <table>
                <tr><th>Règle</th><th>Bon</th><th>Mauvais</th></tr>
                <tr><td>Décrire un état, pas une action</td><td class="good">« Finir en &lt; 3h »</td><td class="bad">« M'entraîner plus »</td></tr>
                <tr><td>Mesurable sans interprétation</td><td class="good">« 66 bpm sans arrêt »</td><td class="bad">« Bien jouer »</td></tr>
                <tr><td>Sans solution dedans</td><td class="good">« Signer chez Bain »</td><td class="bad">« Faire 50 cases pour signer chez Bain »</td></tr>
                <tr><td>Au-delà de ta capacité actuelle</td><td class="good">Tu ne sais pas encore comment y arriver</td><td class="bad">Tu sais déjà exactement quoi faire</td></tr>
              </table>
              <p><strong>La dernière règle est la plus importante :</strong> si le chemin est connu, ce n'est pas un Challenge Kata, c'est un plan à exécuter.</p>
              <p style="color:var(--muted)">Ex. : D'ici avril 2027, finir un marathon en moins de 3h00 (aujourd'hui : 10 km en 46 min), afin de …</p>
            </div>
          </div>
        </div>
        <div class="body">
          <div class="col cond">
            <div>
              <h2>Target Condition</h2>
              <div class="achieve">Achieve by: <input type="date" data-field="targetDate"></div>
            </div>
            ${conditionFields('target')}
            <div class="diagram" id="diag-target"></div>
          </div>
          <div class="col cond">
            <div><h2>Current<br>Condition</h2></div>
            ${conditionFields('current')}
            <div class="diagram" id="diag-current"></div>
          </div>
          <div class="col right">
            <section class="experiments">
              <h2>Experimenting<br>Record</h2>
              <div id="record"></div>
            </section>
            <section class="obstacles">
              <h2>Obstacles Parking Lot</h2>
              <div class="list" id="obsList"></div>
              <button class="add" id="addObs">+ Obstacle</button>
            </section>
          </div>
        </div>
      </div>
    </div>`;

  // Champs simples (data-field accepte un chemin : "target.outcome")
  $('#app').querySelectorAll('[data-field]').forEach(el => {
    el.value = getPath(board, el.dataset.field) || '';
    el.oninput = () => {
      setPath(board, el.dataset.field, el.value);
      if (el.classList.contains('blank')) fitWidth(el);
      if (el.tagName === 'TEXTAREA') autoGrow(el);
      scheduleSave();
    };
  });
  $('#app').querySelectorAll('input.blank').forEach(fitWidth);
  $('#app').querySelectorAll('.head textarea, .metric textarea').forEach(autoGrow);

  const rules = $('#rules');
  $('#helpBtn').onclick = e => { e.stopPropagation(); rules.hidden = !rules.hidden; };
  rules.onclick = e => e.stopPropagation();
  document.onclick = () => { rules.hidden = true; };

  $('#addObs').onclick = () => {
    board.obstacles.push({ id: uid(), text: '', done: false, focus: false });
    renderObstacles(); scheduleSave();
    const inputs = $('#obsList').querySelectorAll('input[type=text]');
    inputs[inputs.length - 1]?.focus();
  };

  renderDiagram('target');
  renderDiagram('current');
  renderRecord();
  renderObstacles();

  // Premier affichage d'un nouvel id : on l'enregistre pour qu'il apparaisse dans la liste.
  if (!DocStore.get(id)) DocStore.save(board);
}

function conditionFields(side) {
  return CONDITION_FIELDS.map(f => `
    <label class="metric ${f.key}">
      <span>${f.label}</span>
      <textarea rows="1" data-field="${side}.${f.key}" placeholder="${esc(f[side])}"></textarea>
    </label>`).join('');
}

/* ============================================================
   Block diagrams : To Be (Target) / As Is (Current)
   ============================================================ */
const MAX_BLOCKS = 6;
const DIAGRAMS = {
  target:  { key: 'toBe', title: 'To Be', canFlag: false },
  current: { key: 'asIs', title: 'As Is', canFlag: true },
};
const blocksOf = side => board[side][DIAGRAMS[side].key];

function renderDiagram(side) {
  const { title, canFlag } = DIAGRAMS[side];
  const blocks = blocksOf(side);
  const el = $('#diag-' + side);

  el.innerHTML = `
    <div class="diagram-head">
      <span>${title}</span>
      ${side === 'target' ? `<button data-act="init" title="Rother : la Target Condition se construit en copiant la Current Condition">Initialiser depuis As Is</button>` : ''}
    </div>
    ${blocks.map((b, i) => `
      <div class="blk ${canFlag && b.isObstacle ? 'obstacle' : ''}" data-i="${i}">
        ${canFlag && b.isObstacle ? '<span class="warn" title="Obstacle">⚠</span>' : ''}
        <input class="blk-name" data-k="name" value="${esc(b.name)}" placeholder="Étape">
        <input class="blk-val" data-k="value" value="${esc(b.value)}" placeholder="valeur">
        <div class="blk-tools">
          ${canFlag ? `<button data-act="flag" class="${b.isObstacle ? 'on' : ''}" title="Marquer comme obstacle">⚠</button>` : ''}
          <button data-act="up" title="Monter" ${i === 0 ? 'disabled' : ''}>↑</button>
          <button data-act="down" title="Descendre" ${i === blocks.length - 1 ? 'disabled' : ''}>↓</button>
          <button data-act="del" title="Supprimer">✕</button>
        </div>
      </div>
      ${i < blocks.length - 1 ? `
        <div class="conn" data-i="${i}">
          <span></span>
          <span class="down">↓</span>
          <span class="side">${typeof b.waitAfter === 'string'
            ? `<span class="tri" title="Attente">▲</span><input data-k="waitAfter" value="${esc(b.waitAfter)}" placeholder="durée"><button data-act="nowait" title="Retirer l'attente">✕</button>`
            : `<button class="add-wait" data-act="wait">+ attente</button>`}</span>
        </div>` : ''}`).join('')}
    <button class="add" data-act="add" ${blocks.length >= MAX_BLOCKS ? 'disabled' : ''}>
      ${blocks.length >= MAX_BLOCKS ? `Maximum ${MAX_BLOCKS} blocs` : '+ Bloc'}
    </button>`;

  // Édition inline : on met à jour le modèle sans re-rendre (le focus est conservé).
  el.querySelectorAll('input[data-k]').forEach(input => {
    const i = +input.closest('[data-i]').dataset.i;
    input.oninput = () => { blocks[i][input.dataset.k] = input.value; scheduleSave(); };
  });

  el.querySelectorAll('[data-act]').forEach(btn => btn.onclick = () => {
    const i = +btn.closest('[data-i]')?.dataset.i;
    const act = btn.dataset.act;
    if (act === 'add') blocks.push({ id: uid(), name: '', value: '', isObstacle: false });
    if (act === 'del') blocks.splice(i, 1);
    if (act === 'up' || act === 'down') {
      const j = act === 'up' ? i - 1 : i + 1;
      [blocks[i], blocks[j]] = [blocks[j], blocks[i]];
    }
    if (act === 'flag') blocks[i].isObstacle = !blocks[i].isObstacle;
    if (act === 'wait') blocks[i].waitAfter = '';
    if (act === 'nowait') delete blocks[i].waitAfter;
    if (act === 'init') {
      const src = blocksOf('current');
      if (!src.length) return toast('Le diagramme As Is est vide');
      if (blocks.length && !confirm(`Remplacer les ${blocks.length} bloc(s) du To Be par une copie de l'As Is ?`)) return;
      board.target.toBe = src.map(b => ({ ...b, id: uid(), isObstacle: false }));
    }
    renderDiagram(side); scheduleSave();
    if (act === 'add') el.querySelectorAll('.blk-name')[blocksOf(side).length - 1]?.focus();
    if (act === 'wait') el.querySelector(`.conn[data-i="${i}"] input`)?.focus();
  });
}

const activeObstacle = () => board.obstacles.find(o => o.focus && !o.done);
const obstacleLabel = o => o.text.trim() || 'Obstacle sans titre';
const shortDate = d => d ? new Date(d + 'T00:00').toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' }) : '';

function setActiveObstacle(id) {
  board.obstacles.forEach(o => o.focus = o.id === id);   // un seul obstacle travaillé à la fois
  renderRecord(); renderObstacles(); scheduleSave();
}

/* Experimenting Record : un bloc par obstacle.
   Seul le bloc de l'obstacle en cours est éditable ; les autres sont archivés en dessous. */
function renderRecord() {
  const active = activeObstacle();
  const open = board.obstacles.filter(o => !o.done);
  const current = active ? board.experiments.filter(x => x.obstacleId === active.id) : [];

  const others = board.obstacles
    .filter(o => o !== active)
    .map(o => ({ o, exps: board.experiments.filter(x => x.obstacleId === o.id) }))
    .filter(g => g.exps.length);
  const knownIds = new Set(board.obstacles.map(o => o.id));
  const orphans = board.experiments.filter(x => !x.obstacleId || !knownIds.has(x.obstacleId));
  if (orphans.length) others.push({ o: null, exps: orphans });

  $('#record').innerHTML = `
    <div class="rec-obs ${active ? '' : 'none'}">
      <strong>Obstacle :</strong>
      <select id="obsSelect">
        <option value="">— choisir dans le Parking Lot —</option>
        ${open.map(o => `<option value="${o.id}" ${o === active ? 'selected' : ''}>${esc(obstacleLabel(o).slice(0, 60))}</option>`).join('')}
      </select>
      ${active ? `<button id="liftObs" title="Archive ce record et libère le Record pour l'obstacle suivant">✓ Obstacle levé</button>` : ''}
    </div>
    ${active ? `
      <div id="expList">${current.map((x, i) => experimentCard(x, i)).join('')}</div>
      <button class="add" id="addExp">+ Nouvelle expérience</button>`
    : `<p class="hint">${open.length ? 'Sélectionnez l\'obstacle travaillé pour ouvrir son record.' : 'Ajoutez un obstacle dans le Parking Lot pour commencer.'}</p>`}
    ${others.length ? `
      <details class="archive">
        <summary>Archives · ${others.length} record${others.length > 1 ? 's' : ''}</summary>
        ${others.map(({ o, exps }) => `
          <div class="arch-group">
            <div class="arch-title">${o ? esc(obstacleLabel(o)) : 'Expériences non rattachées'}
              ${o ? `<span class="badge ${o.done ? 'lifted' : ''}">${o.done ? 'levé' : 'en pause'}</span>` : ''}
            </div>
            <ol>${exps.map(x => `
              <li>${esc(shortDate(x.date))} — ${esc(x.step || '(étape non renseignée)')}
                ${x.learned ? `<div class="learned">→ ${esc(x.learned)}</div>` : ''}</li>`).join('')}
            </ol>
          </div>`).join('')}
      </details>` : ''}`;

  $('#obsSelect').onchange = e => setActiveObstacle(e.target.value || null);
  if (!active) return;

  $('#liftObs').onclick = () => {
    active.done = true; active.focus = false;
    renderRecord(); renderObstacles(); scheduleSave();
    toast('Record archivé — choisissez le prochain obstacle');
  };
  $('#addExp').onclick = () => {
    board.experiments.push({ id: uid(), obstacleId: active.id, date: new Date().toISOString().slice(0, 10), step: '', expect: '', happened: '', learned: '' });
    renderRecord(); scheduleSave();
    const steps = $('#expList').querySelectorAll('[data-k=step]');
    steps[steps.length - 1]?.focus();
  };

  $('#expList').querySelectorAll('.exp').forEach(row => {
    const x = board.experiments.find(e => e.id === row.dataset.id);
    row.querySelectorAll('[data-k]').forEach(el => {
      if (el.tagName === 'TEXTAREA') autoGrow(el);
      el.oninput = () => { x[el.dataset.k] = el.value; if (el.tagName === 'TEXTAREA') autoGrow(el); scheduleSave(); };
    });
    row.querySelector('.del').onclick = () => {
      if (!confirm('Supprimer cette expérience ?')) return;
      board.experiments = board.experiments.filter(e => e !== x);
      renderRecord(); scheduleSave();
    };
  });
}

function experimentCard(x, i) {
  return `
    <div class="exp" data-id="${x.id}">
      <div class="exp-head">
        <span class="num">#${i + 1}</span>
        <input type="date" data-k="date" value="${esc(x.date)}">
        <span class="spacer"></span>
        <button class="icon del" title="Supprimer">✕</button>
      </div>
      <div class="exp-grid">
        <label class="exp-field"><span>Step</span><textarea rows="1" data-k="step" placeholder="Étape / ce que je vais tester">${esc(x.step)}</textarea></label>
        <label class="exp-field"><span>Expect</span><textarea rows="1" data-k="expect" placeholder="Qu'est-ce que j'attends ?">${esc(x.expect)}</textarea></label>
        <label class="exp-field"><span>Happened</span><textarea rows="1" data-k="happened" placeholder="Que s'est-il passé ?">${esc(x.happened)}</textarea></label>
        <label class="exp-field"><span>Learned</span><textarea rows="1" data-k="learned" placeholder="Qu'avons-nous appris ?">${esc(x.learned)}</textarea></label>
      </div>
    </div>`;
}

function renderObstacles() {
  const list = $('#obsList');
  list.innerHTML = board.obstacles.map(o => `
    <div class="obs ${o.done ? 'done' : ''} ${o.focus && !o.done ? 'focus' : ''}" data-id="${o.id}">
      <button class="icon arrow" title="Travailler cet obstacle" ${o.done ? 'disabled' : ''}>➜</button>
      <input type="checkbox" ${o.done ? 'checked' : ''} title="Levé">
      <input type="text" value="${esc(o.text)}" placeholder="Obstacle…">
      <button class="icon del" title="Supprimer">✕</button>
    </div>`).join('');

  list.querySelectorAll('.obs').forEach(row => {
    const o = board.obstacles.find(x => x.id === row.dataset.id);
    const text = row.querySelector('input[type=text]');
    text.oninput = () => { o.text = text.value; scheduleSave(); };
    text.onchange = () => renderRecord();   // met à jour le libellé dans le sélecteur
    text.onkeydown = e => { if (e.key === 'Enter') $('#addObs').click(); };
    row.querySelector('input[type=checkbox]').onchange = e => {
      o.done = e.target.checked;
      if (o.done) o.focus = false;
      renderRecord(); renderObstacles(); scheduleSave();
    };
    row.querySelector('.arrow').onclick = () => setActiveObstacle(o.focus ? null : o.id);
    row.querySelector('.del').onclick = () => {
      const n = board.experiments.filter(x => x.obstacleId === o.id).length;
      if (n && !confirm(`Cet obstacle a ${n} expérience(s). Elles passeront en « non rattachées ». Supprimer ?`)) return;
      board.obstacles = board.obstacles.filter(x => x !== o);
      renderRecord(); renderObstacles(); scheduleSave();
    };
  });
}

route();
</script>
